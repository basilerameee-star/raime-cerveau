# Hermes Agent et le serveur MCP du cerveau, sur le réseau interne de rAIme.
# À poser dans /opt/raime/ par la session locale (hermes/INSTALLER.md). Différences voulues avec le
# docker-compose d'origine d'Hermes : PAS de network_mode: host, PAS de socket Docker, AUCUN port
# publié sur Internet, tableau de bord fermé.
services:
  raime-mcp:
    image: node:20-alpine
    container_name: raime-mcp
    restart: unless-stopped
    working_dir: /app
    command: ["node", "agents/raime_mcp.js"]
    volumes:
      - /opt/raime/raime-brain:/app:ro
    env_file: /opt/raime/mcp.env                   # DATABASE_URL, DATABASE_URL_N8N, RAIME_MCP_JETON, GITHUB_CHANTIER_TOKEN
    environment:
      RAIME_MCP_PORT: "8766"
    networks: [raime_default]

  hermes:
    image: raime-hermes:d0288be5                     # construit depuis le commit vérifié (INSTALLER.md, étape 2)
    container_name: raime-hermes
    # Sans commande, l'image ouvre la conversation dans un terminal ; un conteneur n'en a pas,
    # Hermes s'arrête et Docker le relance en boucle. La passerelle, elle, tourne en continu.
    command: ["gateway", "run"]
    restart: unless-stopped
    depends_on: [raime-mcp]
    volumes:
      - /opt/raime/hermes-data:/opt/data             # config.yaml, SOUL.md, mémoire, compétences
      - ${TRAVAIL_HOTE:-/opt/raime/hermes-data/atelier}:/travail   # le dossier de travail du Cockpit (livrables)
      - /opt/raime/raime-brain:/cerveau:ro           # le code du cerveau, en lecture seule
    env_file: /opt/raime/hermes.env                  # OPENROUTER_API_KEY, RAIME_MCP_JETON, API_SERVER_KEY, Telegram
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"             # le propriétaire de /travail, pour qu'Hermes puisse y écrire
      HERMES_GID: "${HERMES_GID:-10000}"
      API_SERVER_HOST: "0.0.0.0"                     # réseau interne seulement : aucun port publié
    mem_limit: 2g
    cpus: 2
    networks: [raime_default]

  # Le relais : il prend le nom réseau « harness » de l'ancien exécutant ; le Cockpit ne change pas.
  raime-executant:
    image: node:20-alpine
    container_name: raime-executant
    restart: unless-stopped
    depends_on: [hermes]
    working_dir: /app
    command: ["node", "hermes/executant.js"]
    volumes:
      - /opt/raime/raime-brain:/app:ro
      - ${TRAVAIL_HOTE:-/opt/raime/hermes-data/atelier}:/travail
    env_file: /opt/raime/executant.env               # API_SERVER_KEY
    networks:
      raime_default:
        aliases: [harness]

networks:
  raime_default:
    external: true
