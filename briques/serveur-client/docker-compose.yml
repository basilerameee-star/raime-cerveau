# KIT SERVEUR CLIENT rAIme — les automatisations tournent chez le client, sur un serveur a son nom.
# Memes briques que le serveur de rAIme, versions figees (celles qui tournent chez rAIme au 25/09/2026) :
#   n8n 2.34.6 (les automatisations), PostgreSQL 16 (la base), Caddy 2.11 (le cadenas HTTPS).
# Rien n'est expose sauf Caddy (80 et 443) ; n8n et la base ne parlent qu'entre eux.
name: ${PROJET:-automatisations}

services:
  base:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe de la base manquant dans .env}
      POSTGRES_DB: n8n
    volumes:
      - base:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interne]

  n8n:
    image: n8nio/n8n:2.34.6
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: base
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?cle de chiffrement manquante dans .env}
      N8N_HOST: ${DOMAINE:?domaine manquant dans .env}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${DOMAINE}/
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n:/home/node/.n8n
    networks: [interne]

  cadenas:
    image: caddy:2.11
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE}
      EMAIL_CERTIFICATS: ${EMAIL_CERTIFICATS:?adresse pour les certificats manquante dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_donnees:/data
      - caddy_config:/config
    networks: [interne]

volumes:
  base:
  n8n:
  caddy_donnees:
  caddy_config:

networks:
  interne:
