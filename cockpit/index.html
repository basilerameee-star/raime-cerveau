<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rAIme — Cockpit</title>
<style>
  :root{ --bg:#07140e; --panel:#0d2419; --panel2:#0f2c1f; --line:#1c4433; --txt:#e9f1ec; --dim:#8fb3a3; --em:#10b981; --em2:#34d399; --warn:#f5b301; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:radial-gradient(1200px 600px at 75% -10%, #103524 0%, var(--bg) 55%); color:var(--txt);
    font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }

  header{ display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
    position:sticky; top:0; backdrop-filter:blur(8px); background:rgba(7,20,14,.72); z-index:10; }
  .wm{ font-size:21px; font-weight:800; letter-spacing:-.5px; }
  .wm .ai{ color:var(--em2); } .wm i{ font-style:italic; font-family:Georgia,serif; }
  .sub{ font-size:12.5px; color:var(--dim); }
  .cortex{ font-size:11.5px; padding:3px 10px; border-radius:20px; background:var(--em2); color:#04120b; font-weight:700; }
  .live{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--dim); margin-left:auto; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--em2); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)} 70%{box-shadow:0 0 0 9px rgba(52,211,153,0)} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0)} }

  .app{ display:flex; min-height:calc(100vh - 57px); }
  nav.rooms{ width:220px; flex-shrink:0; padding:16px 12px; border-right:1px solid var(--line); position:sticky; top:57px; align-self:flex-start; }
  .room-btn{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0; color:var(--dim);
    font:inherit; font-size:14px; padding:11px 13px; border-radius:11px; cursor:pointer; margin-bottom:3px; transition:.15s; }
  .room-btn:hover{ background:rgba(16,185,129,.08); color:var(--txt); }
  .room-btn.active{ background:linear-gradient(100deg,rgba(16,185,129,.18),rgba(16,185,129,.06)); color:var(--txt); box-shadow:inset 2px 0 0 var(--em2); }
  .room-btn .emo{ font-size:17px; width:22px; text-align:center; }
  .room-btn .cnt{ margin-left:auto; font-size:11px; color:var(--em2); background:rgba(16,185,129,.12); padding:1px 8px; border-radius:20px; min-width:22px; text-align:center; }
  .navhint{ margin-top:16px; padding:11px 13px; font-size:11px; color:var(--dim); line-height:1.5; border-top:1px solid var(--line); }

  main.stage{ flex:1; padding:22px 26px 60px; max-width:1180px; }
  .roomtitle{ font-size:20px; font-weight:800; letter-spacing:-.4px; margin:0 0 4px; }
  .roomdesc{ color:var(--dim); font-size:13px; margin:0 0 20px; }
  h2{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--em2); margin:24px 0 11px; font-weight:700; }
  h2:first-child{ margin-top:4px; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:13px; }
  .kpi{ background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:15px 17px; }
  .kpi .n{ font-size:32px; font-weight:800; line-height:1; letter-spacing:-1px; }
  .kpi.em .n{ color:var(--em2); }
  .kpi .l{ font-size:12px; color:var(--dim); margin-top:7px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:820px){ .grid2{ grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row{ display:flex; gap:10px; align-items:flex-start; padding:11px 15px; border-top:1px solid rgba(28,68,51,.5); }
  .row:first-child{ border-top:0; }
  .badge{ font-size:10.5px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .badge.on{ color:#04120b; background:var(--em2); border-color:var(--em2); font-weight:700; }
  .badge.pres{ color:var(--warn); border-color:#5a4a10; }
  .rel{ font-weight:800; color:var(--em2); min-width:28px; }
  .t{ font-size:13.5px; } .d{ font-size:12px; color:var(--dim); margin-top:2px; line-height:1.45; }
  a.row:hover .t{ color:var(--em2); }
  .stars{ color:var(--warn); font-size:12px; letter-spacing:1px; }
  .empty{ padding:20px 16px; color:var(--dim); font-size:13px; font-style:italic; }
  .bars{ padding:8px 16px 14px; }
  .bar{ display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12.5px; }
  .bar .lab{ width:92px; color:var(--dim); text-transform:capitalize; }
  .bar .track{ flex:1; height:9px; background:#0a1c14; border-radius:6px; overflow:hidden; }
  .bar .fill{ height:100%; background:linear-gradient(90deg,var(--em),var(--em2)); border-radius:6px; transition:width .5s; }
  .bar .v{ width:32px; text-align:right; font-weight:700; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .feedback{ margin-top:24px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); padding-top:14px; }
  /* ---------- Sections repliables (accordéon) ---------- */
  .acc{ border:1px solid var(--line); border-radius:14px; margin-bottom:12px; background:var(--panel); overflow:hidden; }
  .acc>summary{ list-style:none; cursor:pointer; padding:15px 16px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; user-select:none; }
  .acc>summary::-webkit-details-marker{ display:none; }
  .acc>summary .accsub{ color:var(--dim); font-weight:400; font-size:12.5px; }
  .acc>summary .chev{ margin-left:auto; color:var(--dim); font-size:18px; transition:transform .2s; }
  .acc[open]>summary .chev{ transform:rotate(90deg); }
  .acc[open]>summary{ border-bottom:1px solid var(--line); }
  .acc .accbody{ padding:8px 6px 6px; }
  .acc .accbody .panel{ border:0; }
  .homehealth{ display:flex; align-items:center; gap:11px; background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:15px 17px; margin-top:16px; }

  /* ---------- MOBILE (iPhone & co) ---------- */
  @media (max-width:768px){
    header{ position:static; padding:11px 14px; gap:9px; }
    .wm{ font-size:18px; } .sub{ display:none; }
    .cortex{ font-size:10px; padding:2px 8px; }
    .live{ font-size:10.5px; }
    .app{ flex-direction:column; min-height:auto; }
    nav.rooms{ width:100%; flex-direction:row; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      position:sticky; top:0; align-self:stretch; border-right:0; border-bottom:1px solid var(--line);
      padding:8px 10px; gap:6px; background:rgba(7,20,14,.94); backdrop-filter:blur(10px); z-index:9; }
    nav.rooms::-webkit-scrollbar{ display:none; }
    .room-btn{ width:auto; flex:0 0 auto; margin-bottom:0; padding:9px 13px; font-size:13px; border-radius:22px; }
    .room-btn.active{ box-shadow:none; background:var(--em2); color:#04120b; }
    .room-btn.active .cnt{ background:rgba(0,0,0,.16); color:#04120b; }
    .navhint{ display:none; }
    main.stage{ padding:16px 14px 96px; max-width:100%; }
    .roomtitle{ font-size:19px; } .roomdesc{ font-size:12.5px; }
    .kpis{ grid-template-columns:repeat(2,1fr); gap:10px; }
    .kpi{ padding:13px 14px; } .kpi .n{ font-size:25px; }
    .grid2{ grid-template-columns:1fr; }
    .cards, .agents{ grid-template-columns:1fr; }
    .row{ padding:11px 13px; }
    .bar .lab{ width:78px; }
    #chatbox{ max-height:62vh; }
    #auditbar{ bottom:16px; width:calc(100% - 28px); }
    #auditbar #prepAudit{ width:100%; }
    #toast{ right:14px; left:14px; bottom:16px; max-width:none; }
    pre{ font-size:12px; }
  }
</style>
</head>
<body>
<header>
  <div class="wm">r<span class="ai">AI</span><i>me</i></div>
  <div class="sub">Cockpit</div>
  <span class="cortex">🧠 Cortex · chef d'orchestre</span>
  <div class="live"><span class="dot"></span><span id="upd">connexion…</span></div>
</header>

<div class="app">
  <nav class="rooms" id="nav"></nav>
  <main class="stage" id="stage"></main>
</div>

<div id="auditbar" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:none;z-index:50">
  <button id="prepAudit" style="background:var(--em2);color:#04120b;border:0;font:inherit;font-weight:800;font-size:14px;padding:13px 22px;border-radius:30px;cursor:pointer;box-shadow:0 8px 30px -6px rgba(16,185,129,.6)">🏛️ Préparer l'audit (0)</button>
</div>
<div id="toast" style="position:fixed;bottom:22px;right:22px;display:none;background:var(--panel2);border:1px solid var(--em);color:var(--txt);padding:13px 18px;border-radius:12px;font-size:13px;z-index:60;max-width:300px"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let DATA = {};
let ROOM = localStorage.getItem('room') || 'overview';
const selected = new Set();
function toast(msg){ const t=$('toast'); if(!t)return; t.textContent=msg; t.style.display='block'; clearTimeout(window._tt); window._tt=setTimeout(()=>{t.style.display='none';},5000); }
function updateAuditBtn(){ const bar=$('auditbar'), btn=$('prepAudit'); if(!bar||!btn)return; btn.textContent="🏛️ Préparer l'audit ("+selected.size+")"; bar.style.display=selected.size?'block':'none'; }
function bindSelection(){
  document.querySelectorAll('.psel').forEach(cb=>{
    cb.checked = selected.has(cb.dataset.siren);
    cb.onchange = (e)=>{ if(e&&e.stopPropagation)e.stopPropagation(); if(cb.checked) selected.add(cb.dataset.siren); else selected.delete(cb.dataset.siren); updateAuditBtn(); };
  });
  updateAuditBtn();
}

const EMO = { Cortex:'🧠', Vigie:'🛰️', Sherlock:'🔎', Fureteur:'🕵️', Amy:'✍️', 'Athéna':'🦉', Plume:'📚', 'Léonard':'🏛️', 'Expéditeur':'📤', Labo:'🧪' };
const DESC = { Vigie:'Veille l\'actu IA chaque jour → nourrit le RAG.', Sherlock:'Source de vraies entreprises ciblées, 24/7.', Fureteur:'Trouve les emails des prospects sur le web.', Amy:'Rédige les emails et messages LinkedIn personnalisés.', 'Athéna':'Analyse les résultats chaque soir, propose des améliorations.', 'Léonard':'Prépare les fiches d\'audit sur-mesure (devis : phase 2 à venir).', 'Expéditeur':'Envoie les emails validés — inactif, attend le go-live (domaines + warm-up).', Plume:'Créera du contenu / des livres (à venir).', Labo:'Essais.' };
const agentOf = name => (String(name).split(' · ')[0] || name);

const rooms = [
  { id:'overview',    emo:'🏠', label:"Vue d'ensemble", badge:d=>null },
  { id:'cortex',      emo:'💬', label:'Cortex',         badge:d=>null },
  { id:'prospection', emo:'🎯', label:'Prospection',     badge:d=>(d.prospects?d.prospects.total:0) },
  { id:'veille',      emo:'📡', label:'Veille & Intel',  badge:d=>(d.veille?d.veille.new24h:0) },
  { id:'agents',      emo:'🤖', label:'Les agents',      badge:d=>(d.workflows?d.workflows.filter(w=>w.active).length:0) },
  { id:'emails',      emo:'📧', label:'Emails',          badge:d=>(d.outreach?d.outreach.total:0) },
  { id:'linkedin',    emo:'💬', label:'LinkedIn',        badge:d=>(d.linkedin?d.linkedin.length:0) },
  { id:'sai',         emo:'🏛️', label:'SAI / Devis',     badge:d=>(d.audits?d.audits.length:0) },
  { id:'taches',      emo:'✅', label:'Mes tâches',      badge:d=>(d.tasks?d.tasks.length:0) },
  { id:'ventes',      emo:'💶', label:'Ventes',          badge:d=>null },
];

/* ---------- briques réutilisables ---------- */
function kpiCards(list){
  return '<div class="kpis">'+list.map(k=>'<div class="kpi'+(k.em?' em':'')+'"><div class="n">'+(k.n)+'</div><div class="l">'+k.l+'</div></div>').join('')+'</div>';
}
function acc(title, sub, inner, open){
  return '<details class="acc"'+(open?' open':'')+'><summary>'+title+(sub?' <span class="accsub">'+esc(sub)+'</span>':'')+'<span class="chev">›</span></summary><div class="accbody">'+inner+'</div></details>';
}
function pipeline(p){
  const order=['nouveau','qualifié','contacté','répondu','client','écarté'];
  const bs=(p&&p.byStatus)||{}; const max=Math.max(1,...order.map(s=>bs[s]||0));
  return '<div class="panel"><div class="bars">'+order.map(s=>{
    const v=bs[s]||0; return '<div class="bar"><div class="lab">'+s+'</div><div class="track"><div class="fill" style="width:'+(v/max*100)+'%"></div></div><div class="v">'+v+'</div></div>';
  }).join('')+'</div></div>';
}
function topProspects(p){
  const t=(p&&p.top)||[];
  return '<div class="panel">'+(t.length? t.map(r=>'<label class="row" style="cursor:pointer;align-items:center"><input type="checkbox" class="psel" data-siren="'+esc(r.siren)+'" style="width:16px;height:16px;accent-color:var(--em2);flex:0 0 auto"><div class="rel">'+(r.score==null?'–':r.score)+'</div><div style="flex:1"><div class="t">'+esc(r.name)+'</div><div class="d">'+esc(r.sector||'')+(r.departement?' · '+esc(r.departement):'')+'</div></div><span class="badge">'+esc(r.status||'nouveau')+'</span></label>').join('')
    : '<div class="empty">Aucun prospect encore. Dès que Sherlock tourne, ils apparaissent ici en direct.</div>')+'</div>';
}
function priorities(d){
  const t=d.priorities||[];
  return '<div class="panel">'+(t.length? t.map(r=>'<div class="row"><div style="flex:1"><div class="t">'+esc(r.segment)+(r.is_prescripteur?' <span class="badge pres" style="font-size:9.5px;padding:1px 6px">prescr.</span>':'')+'</div><div class="stars">'+'★'.repeat(r.stars||0)+'</div></div>'
   +'<div style="text-align:right"><div class="t" style="color:var(--em2);font-weight:800">'+(r.clients||0)+' <span style="color:var(--dim);font-weight:400;font-size:11px">clients</span></div><div class="d">'+(r.prospects||0)+' prospects</div></div></div>').join('') : '<div class="empty">—</div>')+'</div>';
}
function veilleList(v){
  const t=(v&&v.top)||[];
  return '<div class="panel">'+(t.length? t.map(r=>'<a class="row" href="'+esc(r.url)+'" target="_blank" rel="noopener"><div class="rel">'+(r.relevance==null?'–':r.relevance)+'</div><div style="flex:1"><div class="t">'+esc(r.title)+'</div><div class="d">'+esc(r.source)+(r.summary?' — '+esc(r.summary):'')+'</div></div></a>').join('') : '<div class="empty">Veille en cours de remplissage…</div>')+'</div>';
}
function learningsList(l){
  const t=(l&&l.recent)||[];
  return '<div class="panel">'+(t.length? t.map(r=>'<div class="row"><span class="badge">'+esc(r.category)+'</span><div style="flex:1"><div class="t" style="font-size:12.5px">'+esc(r.observation).slice(0,180)+'</div></div><span class="badge '+(r.resolved?'on':'')+'">'+(r.resolved?'traité':'ouvert')+'</span></div>').join('') : '<div class="empty">—</div>')+'</div>';
}
function notesList(n){
  return '<div class="panel">'+((n&&n.length)? n.map(r=>'<div class="row"><span class="badge">'+((EMO[agentOf(r.agent)]||'')+' '+esc(r.agent))+'</span><div style="flex:1"><div class="t" style="font-size:12.5px">'+esc(r.content).slice(0,240)+'</div></div></div>').join('') : '<div class="empty">Le fil se remplira quand les agents s\'échangeront des décisions.</div>')+'</div>';
}
function tasksList(ts){
  return '<div class="panel">'+((ts&&ts.length)? ts.map(t=>{
    const pr=t.priority===1?'#f5b301':(t.priority===3?'#5a8':'var(--dim)');
    const due=t.due?' · échéance '+new Date(t.due).toLocaleDateString('fr-FR'):'';
    return '<div class="row"><span class="badge" style="color:'+pr+';border-color:'+pr+'">'+(t.priority===1?'⚑ haut':(t.priority===3?'bas':'moyen'))+'</span><div style="flex:1"><div class="t">'+esc(t.title)+'</div><div class="d">'+esc(t.detail||'')+due+'</div></div><span class="badge">'+esc(t.source)+'</span></div>';
  }).join('') : '<div class="empty">Aucune tâche en attente. Envoie-m\'en une, ou elles arriveront de tes emails.</div>')+'</div>';
}

/* ---------- salles ---------- */
const RENDER = {
  cortex(d){
    return `<div class="roomtitle">💬 Cortex</div><div class="roomdesc">Ton chef d'orchestre, en direct. Pose une question, demande un point ou un conseil — il connaît l'état de tout le système.</div>`
      + '<div id="chatbox" style="display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow-y:auto;padding:4px 2px"></div>'
      + '<div style="display:flex;gap:8px;margin-top:14px"><input id="chatin" placeholder="Écris à Cortex…" autocomplete="off" style="flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:14px;padding:12px 14px;border-radius:12px;outline:none"><button id="chatsend" style="background:var(--em2);color:#04120b;border:0;font:inherit;font-weight:800;padding:0 22px;border-radius:12px;cursor:pointer">Envoyer</button></div>';
  },
  overview(d){
    const p=d.prospects||{}, v=d.veille||{}, o=d.outreach||{};
    const urgent=(d.tasks||[]).filter(t=>t.priority===1).slice(0,3);
    const agentsOn=(d.workflows||[]).filter(w=>w.active).length;
    let html=`<div class="roomtitle">Bonjour Basile 👋</div><div class="roomdesc">L'essentiel est ici. Le détail est rangé dans les salles (onglets en haut). Une question ? → salle 💬 Cortex.</div>`;
    html+= kpiCards([{n:p.total||0,l:'Prospects',em:1},{n:o.total||0,l:'Emails prêts'},{n:(d.devis&&d.devis.length)||0,l:'Devis'}]);
    html+='<h2>À faire maintenant</h2>';
    html+= urgent.length? '<div class="panel">'+urgent.map(t=>'<div class="row"><span class="badge" style="color:var(--warn);border-color:#5a4a10">⚑</span><div class="t" style="flex:1">'+esc(t.title)+'</div></div>').join('')+'</div>' : '<div class="empty">Rien d\'urgent. 🎉</div>';
    html+='<div class="homehealth"><span class="dot"></span><div class="d" style="color:var(--txt);font-size:13.5px"><b>'+agentsOn+' agents tournent 24/7</b> · '+(p.avec_email||0)+' emails trouvés · '+(v.new24h||0)+' actus IA aujourd\'hui</div></div>';
    html+='<div class="homehealth" style="margin-top:10px"><span class="dot"></span><div class="d" style="color:var(--txt);font-size:14px"><b>📤 '+(d.sendsToday||0)+' emails envoyés aujourd\'hui</b></div></div>';
    const rs=d.recentSends||[];
    const rsInner= rs.length? '<div class="panel">'+rs.map(s=>'<div class="row"><div style="flex:1"><div class="t">'+esc(s.prospect_name||'')+'</div><div class="d">'+esc(s.to_email||'')+'</div></div><div class="d" style="white-space:nowrap">'+(s.sent_at? new Date(s.sent_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'</div></div>').join('')+'</div>' : '<div class="empty">Aucun envoi récent</div>';
    html+= acc('📤 Derniers emails envoyés', (d.sendsToday||0)+' aujourd\'hui', rsInner, false);
    const audit=d.audit||[];
    const sevColor={alerte:'#f5b301',amelioration:'var(--em2)',info:'var(--dim)'};
    const auditInner= audit.length? '<div class="panel">'+audit.map(a=>'<div class="row"><span class="badge" style="color:'+(sevColor[a.severity]||'var(--dim)')+'">'+esc(a.severity||'')+'</span><div style="flex:1"><div class="t">'+esc(a.titre||'')+'</div><div class="d">'+esc(a.detail||'')+'</div></div></div>').join('')+'</div>' : '<div class="empty">Aucun constat — système sain ✅</div>';
    const nbAlertes= audit.filter(a=>a.severity==='alerte').length;
    html+= acc('🔍 Contrôle système', (nbAlertes? nbAlertes+' alerte(s)':'audité')+' · Auditeur / 6h', auditInner, nbAlertes>0);
    return html;
  },
  prospection(d){
    return `<div class="roomtitle">🎯 Prospection</div><div class="roomdesc">Qui on vise, où on en est.</div>`
      + acc('Pipeline', 'vue rapide', pipeline(d.prospects), true)
      + acc('Meilleurs prospects', 'coche pour préparer un audit 🏛️', topProspects(d.prospects), false)
      + acc('Ciblage prioritaire', 'secteurs & conversion', priorities(d), false);
  },
  veille(d){
    return `<div class="roomtitle">📡 Veille & Intelligence</div><div class="roomdesc">Ce que le marché IA bouge, et ce que le système apprend.</div>`
      + acc('Veille IA', 'top pertinence', veilleList(d.veille), true)
      + acc('Découvertes internes', 'ce que le système a appris', learningsList(d.learnings), false);
  },
  agents(d){
    const orch=d.orchestrator||{name:'Cortex',role:''};
    let html=`<div class="roomtitle">🤖 Les agents</div><div class="roomdesc">Ton équipe autonome. Cortex pilote, les autres exécutent.</div>`;
    html+='<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:6px"><div style="font-size:30px">🧠</div><div style="flex:1"><div class="t" style="font-size:16px;font-weight:800">'+esc(orch.name)+'</div><div class="d">'+esc(orch.role)+'</div></div><span class="badge on">ORCHESTRATEUR</span></div>';
    const wfHtml='<div class="panel">'+((d.workflows&&d.workflows.length)? d.workflows.map(w=>{
      const a=agentOf(w.name); const e=EMO[a]||'⚙️';
      return '<div class="row"><div style="font-size:16px;width:22px;text-align:center">'+e+'</div><div style="flex:1"><div class="t">'+esc(w.name)+'</div><div class="d">'+(DESC[a]||'')+'</div></div><span class="badge '+(w.active?'on':'')+'">'+(w.active?'ACTIF':'en pause')+'</span></div>';
    }).join('') : '<div class="empty">—</div>')+'</div>';
    const nb=(d.workflows||[]).filter(w=>w.active).length;
    html+= acc('Les agents & leurs rôles', nb+' actifs', wfHtml, false);
    html+= acc('Fil des agents', 'le canal où ils communiquent', notesList(d.notes), false);
    return html;
  },
  taches(d){
    return `<div class="roomtitle">✅ Mes tâches</div><div class="roomdesc">Tes rappels et les tâches issues de tes emails. Dis-moi « fait » et je les coche.</div>`
      + tasksList(d.tasks);
  },
  emails(d){
    const o=d.outreach||{}, p=d.prospects||{};
    let html=`<div class="roomtitle">📧 Emails prospects</div><div class="roomdesc">Brouillons rédigés par Amy, personnalisés par secteur. <b style="color:var(--em2)">Rien n'est envoyé sans ta validation.</b></div>`;
    html+=kpiCards([{n:p.avec_email||0,l:'Emails trouvés',em:1},{n:o.total||0,l:'Brouillons prêts',em:1},{n:(o.byStatus&&o.byStatus.envoye)||0,l:'Envoyés'}]);
    html+= acc('Brouillons à relire & valider', (o.total||0)+' en attente', ((o.recent&&o.recent.length)? '<div class="panel">'+o.recent.map(r=>
      '<div class="row" style="flex-direction:column;align-items:stretch;gap:5px"><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><span class="badge '+(r.status==='valide'?'on':(r.status==='envoye'?'pres':''))+'">'+esc(r.status)+'</span><span class="t" style="font-weight:800">'+esc(r.subject)+'</span><span style="margin-left:auto" class="d">'+esc(r.to_email)+'</span></div><div class="d">'+esc(r.prospect_name)+' · '+esc(r.segment)+'</div><div class="d" style="white-space:pre-wrap;color:var(--txt);opacity:.82;margin-top:3px">'+esc(r.body)+'</div>'
      +(r.status==='brouillon'?'<div style="display:flex;gap:8px;margin-top:9px"><button onclick="outreachAction('+r.id+',\'valide\')" style="background:var(--em2);color:#04120b;border:0;font:inherit;font-weight:700;font-size:12px;padding:7px 15px;border-radius:8px;cursor:pointer">✓ Valider</button><button onclick="outreachAction('+r.id+',\'refuse\')" style="background:none;color:var(--dim);border:1px solid var(--line);font:inherit;font-size:12px;padding:7px 15px;border-radius:8px;cursor:pointer">✗ Refuser</button></div>':'')
      +'</div>'
    ).join('')+'</div>' : '<div class="empty">Aucun brouillon encore. Amy en rédige dès que Fureteur trouve des emails.</div>'), true);
    return html;
  },
  linkedin(d){
    const li=d.linkedin||[];
    const enc=s=>encodeURIComponent(s||'').replace(/'/g,'%27');
    const blk=(lbl,txt)=>'<div style="background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px"><div class="d" style="text-transform:uppercase;letter-spacing:1px;font-size:10px;margin-bottom:5px">'+lbl+'</div><div style="font-size:13px;white-space:pre-wrap;line-height:1.5">'+esc(txt)+'</div><button onclick="copyText(this,\''+enc(txt)+'\')" style="margin-top:9px;background:var(--em2);color:#04120b;border:0;font:inherit;font-weight:700;font-size:11px;padding:5px 13px;border-radius:7px;cursor:pointer">Copier</button></div>';
    let html=`<div class="roomtitle">💬 Messages LinkedIn</div><div class="roomdesc">Rédigés par Amy, prêts à copier-coller. Tu cherches la personne sur LinkedIn et tu envoies à la main — sûr, forte conversion.</div>`;
    html+= li.length? '<div class="panel">'+li.map(r=>
      '<div class="row" style="flex-direction:column;align-items:stretch;gap:9px"><div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap"><span class="badge">'+esc(r.status)+'</span><span class="t" style="font-weight:800">'+esc(r.prospect_name)+'</span><span class="d">'+esc(r.segment)+'</span></div>'
      +blk('Note de connexion (max 280)', r.connection_note)
      +blk('Message de suivi', r.message)
      +'</div>'
    ).join('')+'</div>' : '<div class="empty">Aucun message encore. Amy en prépare pour tes meilleures cibles.</div>';
    return html;
  },
  sai(d){
    const cat=d.sai_catalog||[], au=d.audits||[], dv=d.devis||[];
    const fmt=(mn,mx,u)=>{ const unit=u==='jour'?' /j':(u==='mois'?' /mois':''); if(mn&&mx&&mn!==mx) return mn+'–'+mx+' €'+unit; if(mn&&!mx) return 'dès '+mn+' €'+unit; return (mn||'?')+' €'+unit; };
    const grille='<div class="panel">'+(cat.length? cat.map(c=>'<div class="row"><div style="flex:1"><div class="t">'+esc(c.offre)+'</div><div class="d">'+esc(c.categorie)+(c.notes?' · '+esc(c.notes):'')+'</div></div><div class="t" style="color:var(--em2);font-weight:800;white-space:nowrap">'+fmt(c.prix_min,c.prix_max,c.unite)+'</div></div>').join('') : '<div class="empty">—</div>')+'</div>';
    const fiches= au.length? '<div class="panel">'+au.map(a=>'<details class="row" style="flex-direction:column;align-items:stretch"><summary style="cursor:pointer;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap"><span class="t" style="font-weight:800">'+esc(a.entreprise)+'</span><span class="d">'+esc(a.secteur||'')+(a.taille?' · '+esc(a.taille):'')+'</span></summary><pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--txt);opacity:.85;margin:12px 0 2px">'+esc(a.contenu)+'</pre></details>').join('')+'</div>' : '<div class="empty">Aucune fiche encore. Prépare un audit (salle Prospection) et elle apparaît ici.</div>';
    const devisHtml= dv.length? '<div class="panel">'+dv.map(v=>{
      let lignes=[]; try{ lignes=Array.isArray(v.lignes)?v.lignes:(v.lignes?JSON.parse(v.lignes):[]); }catch(e){}
      let res=[]; try{ res=Array.isArray(v.resultats)?v.resultats:(v.resultats?JSON.parse(v.resultats):[]); }catch(e){}
      const items=lignes.map(l=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0"><div><div class="t" style="font-size:13px">'+esc(l.offre)+'</div>'+(l.description?'<div class="d" style="font-size:11.5px">'+esc(l.description)+'</div>':'')+'</div><div class="t" style="white-space:nowrap;font-weight:700">'+(parseInt(l.prix_ht)||0)+' €</div></div>').join('');
      const resChips= res.length? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'+res.map(r=>'<span class="badge" style="color:var(--em2)">✓ '+esc(r)+'</span>').join('')+'</div>':'';
      const ded=parseInt(v.deduction_audit)||0; const net=(v.net_ht!=null)?v.net_ht:(v.total_ht||0);
      return '<details class="row" style="flex-direction:column;align-items:stretch"><summary style="cursor:pointer;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap"><span class="t" style="font-weight:800">'+esc(v.entreprise)+'</span><span class="badge">'+esc(v.status)+'</span><span style="margin-left:auto;color:var(--em2);font-weight:800">'+net+' € HT</span></summary><div style="margin-top:10px">'
        +(v.objectif?'<div class="card" style="padding:12px 14px;margin-bottom:10px"><div style="color:var(--em2);text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700">Objectif</div><div class="t" style="margin-top:3px">'+esc(v.objectif)+'</div></div>':'')
        +'<div class="d" style="color:var(--txt);opacity:.85"><b>Diagnostic :</b> '+esc(v.diagnostic||'')+'</div>'
        +(v.roi?'<div class="d" style="color:var(--em2);margin-top:6px"><b>💡 ROI estimé :</b> '+esc(v.roi)+'</div>':'')
        +resChips
        +'<div style="margin:12px 0;border-top:1px solid var(--line);padding-top:10px"><div class="d" style="text-transform:uppercase;letter-spacing:1px;font-size:10px;color:var(--dim);font-weight:700;margin-bottom:4px">Investissement initial</div>'+items
        +'<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--dim)"><span>Sous-total</span><span>'+(v.total_ht||0)+' €</span></div>'
        +(ded?'<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--dim)"><span>Audit déduit si projet lancé</span><span>− '+ded+' €</span></div>':'')
        +'<div class="t" style="display:flex;justify-content:space-between;font-weight:800;margin-top:6px;color:var(--em2);font-size:15px"><span>Net à investir</span><span>'+net+' € HT</span></div></div>'
        +(v.maintenance_plan?'<div class="card" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center"><div><div class="t" style="font-weight:700">Accompagnement '+esc(v.maintenance_plan)+'</div><div class="d">mensuel, résiliable</div></div><div class="t" style="color:var(--em2);font-weight:800;white-space:nowrap">'+(v.maintenance_prix||0)+' €/mois</div></div>':'')
        +'<div class="d" style="font-style:italic;color:var(--dim);margin-top:10px">'+esc(v.argumentaire||'')+'</div>'
        +'<div class="d" style="font-size:11px;margin-top:6px">TVA non applicable (art. 293 B du CGI)</div>'
        +'</div></details>';
    }).join('')+'</div>' : '<div class="empty">Aucun devis encore. Envoie à Léonard tes retours de RDV → il chiffre et le devis apparaît ici.</div>';
    return `<div class="roomtitle">🏛️ SAI · Offres & Devis</div><div class="roomdesc">Audit → Formation → Automatisation → Optimisation → Maintenance.</div>`
      + acc('Devis chiffrés', dv.length+' au total', devisHtml, true)
      + acc('Fiches d\'audit', au.length+' fiches', fiches, false)
      + acc('Grille tarifaire', 'référence interne', grille, false);
  },
  ventes(d){
    const v=d.veille||{};
    return `<div class="roomtitle">💶 Ventes</div><div class="roomdesc">Ce que rAIme encaisse.</div>`
      + '<div class="grid2"><div class="card"><div class="t" style="font-size:15px;font-weight:800">📘 L\'IA pour TOUS</div><div class="d" style="margin-top:6px">Livre en vente directe — 19 € · paiement Stripe <b style="color:var(--em2)">LIVE</b> · livraison auto du PDF par email.</div><div style="margin-top:12px"><span class="badge on">EN VENTE</span></div></div>'
      + '<div class="card"><div class="t" style="font-size:15px;font-weight:800">Suivi des ventes</div><div class="d" style="margin-top:6px">À connecter : webhook Stripe → cette salle affichera ventes, CA, remboursements en direct.</div><div style="margin-top:12px"><span class="badge">à brancher</span></div></div></div>';
  },
};

/* ---------- moteur ---------- */
function renderNav(){
  $('nav').innerHTML = rooms.map(r=>{
    const b=r.badge(DATA); const cnt=(b!=null&&b!==0)?'<span class="cnt">'+b+'</span>':'';
    return '<button class="room-btn'+(r.id===ROOM?' active':'')+'" data-room="'+r.id+'"><span class="emo">'+r.emo+'</span><span>'+r.label+'</span>'+cnt+'</button>';
  }).join('') + '<div class="navhint">Balade-toi de salle en salle. Tout est en direct depuis le VPS, rafraîchi toutes les 10 s.</div>';
  document.querySelectorAll('.room-btn').forEach(b=>b.onclick=()=>{ ROOM=b.dataset.room; localStorage.setItem('room',ROOM); paint(); });
}
let lastRoom=null;
function paint(){
  renderNav();
  if(ROOM==='cortex'){
    if(lastRoom!=='cortex'){ $('stage').innerHTML = RENDER.cortex(DATA); loadChat(); }
    lastRoom=ROOM; return;
  }
  $('stage').innerHTML = (RENDER[ROOM]||RENDER.overview)(DATA)
    + '<div class="feedback">💬 Un retour sur cette salle ? Dis-le à Cortex — je réagence à ta main.</div>';
  bindSelection();
  lastRoom=ROOM;
}
function chatBubble(role, text){
  const me = role!=='assistant';
  return '<div style="align-self:'+(me?'flex-end':'flex-start')+';max-width:84%;background:'+(me?'rgba(16,185,129,.14)':'var(--panel)')+';border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap">'+esc(text)+'</div>';
}
async function loadChat(){
  try{ const r=await fetch('/api/chat-history'); const d=await r.json(); const box=$('chatbox');
    if(box){ box.innerHTML=(d.messages&&d.messages.length)? d.messages.map(m=>chatBubble(m.role,m.content)).join('') : '<div class="empty">Dis bonjour à Cortex 👋 — demande-lui un point, un conseil, ou « qu\'est-ce que je dois faire maintenant ? »</div>'; box.scrollTop=box.scrollHeight; }
  }catch(e){}
  const inp=$('chatin'), btn=$('chatsend');
  if(btn) btn.onclick=sendChat;
  if(inp) inp.onkeydown=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } };
}
async function sendChat(){
  const inp=$('chatin'), box=$('chatbox'); if(!inp||!box) return;
  const msg=(inp.value||'').trim(); if(!msg) return; inp.value='';
  box.insertAdjacentHTML('beforeend', chatBubble('user',msg));
  const tid='think'+Date.now();
  box.insertAdjacentHTML('beforeend','<div id="'+tid+'" style="align-self:flex-start;color:var(--dim);font-size:13px;padding:4px 6px">Cortex réfléchit…</div>');
  box.scrollTop=box.scrollHeight;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json(); const t=$(tid); if(t) t.remove();
    box.insertAdjacentHTML('beforeend', chatBubble('assistant', d.reply||''));
    box.scrollTop=box.scrollHeight;
  }catch(e){ const t=$(tid); if(t){ t.textContent='Erreur réseau, réessaie.'; } }
}
async function tick(){
  try{ const r=await fetch('/api/kpi',{cache:'no-store'}); DATA=await r.json();
    const t=new Date(DATA.ts); $('upd').textContent='à jour '+t.toLocaleTimeString('fr-FR'); paint();
  }catch(e){ $('upd').textContent='reconnexion…'; }
}
$('prepAudit').onclick = async ()=>{
  const sirens=[...selected]; if(!sirens.length) return;
  const btn=$('prepAudit'); btn.disabled=true; btn.textContent='Préparation…';
  try{
    const r=await fetch('/api/prepare-audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sirens})});
    const d=await r.json();
    toast('🏛️ '+(d.triggered||0)+" fiche(s) en préparation par Léonard. Elles arrivent dans la salle SAI dans ~15 s.");
    selected.clear(); document.querySelectorAll('.psel').forEach(cb=>{cb.checked=false;}); updateAuditBtn();
  }catch(e){ toast('Erreur — réessaie.'); }
  btn.disabled=false;
};
window.outreachAction = async (id, action)=>{
  try{ await fetch('/api/outreach-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});
    toast(action==='valide'?"✓ Validé — prêt à partir dès que l'envoi sera activé.":"Brouillon refusé.");
    tick();
  }catch(e){ toast('Erreur — réessaie.'); }
};
window.copyText = (btn, text)=>{
  const t = decodeURIComponent(text);
  navigator.clipboard.writeText(t).then(()=>{ const o=btn.textContent; btn.textContent='✓ Copié'; setTimeout(()=>btn.textContent=o,1500); }).catch(()=>toast('Copie impossible'));
};
tick(); setInterval(tick, 10000);
</script>
</body>
