<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clips · KinGKlip</title>
<style>
:root{--n:#000;--b:#f5f5f5;--g:#a6a6a6;--t:rgba(245,245,245,.14)}
*{box-sizing:border-box;margin:0}
body{background:var(--n);color:var(--b);font:15px/1.5 Inter,system-ui,sans-serif;padding:20px 16px 80px;max-width:1100px;margin:0 auto}
a{color:inherit}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em}
h2{font-size:18px;font-weight:600;margin:34px 0 4px}
.mono{font:500 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.tete{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
form{display:grid;gap:10px;padding:16px;border:1px solid var(--t);border-radius:12px}
input,textarea,select{width:100%;background:#0b0b0b;color:var(--b);border:1px solid var(--t);border-radius:8px;padding:11px 12px;font:inherit}
textarea{min-height:64px;resize:vertical}
.ligne{display:grid;grid-template-columns:1fr 110px;gap:10px}
button{font:600 14px Inter,system-ui,sans-serif;padding:11px 16px;border-radius:999px;border:1px solid var(--b);background:var(--b);color:var(--n);cursor:pointer}
button.vide{background:transparent;color:var(--b);border-color:var(--t)}
.msg{font-size:13px;color:var(--g);min-height:1em}
.demandes{margin-top:12px;font-size:13px;color:var(--g)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:12px}
.clip{border:1px solid var(--t);border-radius:12px;overflow:hidden;background:#070707}
video{display:block;width:100%;aspect-ratio:9/16;background:#111}
.corps{padding:12px;display:grid;gap:8px}
.corps b{font-size:14px}
.corps textarea{font-size:13px;min-height:72px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a,.actions button{font-size:13px;padding:8px 12px}
.actions a{border:1px solid var(--t);border-radius:999px;text-decoration:none}
.pub{display:grid;grid-template-columns:90px 1fr auto;gap:6px;align-items:center;font-size:12px}
.pub input{padding:7px 8px;font-size:12px}
.pub button{padding:7px 10px;font-size:12px}
.ok{color:var(--b)}
</style>
</head>
<body>
<div class="tete"><h1>Clips · KinGKlip</h1><a class="mono" href="/">← Jarvis</a></div>

<form id="f">
  <p class="mono">Nouvelle vidéo d'une campagne Whop rejointe</p>
  <input name="url" placeholder="Lien de la vidéo source (facultatif s'il est dans le brief)">
  <div class="ligne"><input name="campagne" placeholder="Nom de la campagne (sinon : nom du document)"><input name="nombre" type="number" min="1" max="40" value="20" title="Nombre de clips"></div>
  <label class="mono" style="display:grid;gap:6px">Le brief en document (PDF ou texte) : le lien de la vidéo y est lu
    <input type="file" name="fichier" accept=".pdf,.txt,.md"></label>
  <textarea name="consignes" placeholder="… ou le brief complet copié-collé (règles, paiement, lien de la vidéo)"></textarea>
  <button>Lancer la découpe</button>
  <p class="msg" id="msg"></p>
</form>
<div class="demandes" id="demandes"></div>
<div id="campagnes"></div>

<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ETATS = { a_faire: 'en file', en_cours: 'en découpe…', fait: 'prête', echec: 'échec' };
const ETATS_BUF = { a_faire: 'envoi à Buffer…', programme: 'programmé', publie: 'publié ✓', echec: 'échec' };
const NOMS = { tiktok: 'TikTok', instagram: 'Instagram', youtube: 'YouTube', x: 'X' };
async function api(u, corps) {
  const r = await fetch(u, corps ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) } : {});
  return r.json();
}
// le dossier de la campagne : conditions de paiement, règles du brief, liens publiés à déclarer à Whop
function dossier(c) {
  const b = c.brief || {}, r = b.remuneration || {};
  const liens = c.clips.flatMap((k) => k.publies.filter((p) => !p.declare_whop).map((p) => `${k.clip} · ${NOMS[p.plateforme] || p.plateforme} : ${p.lien}`));
  return `<details class="clip" style="padding:12px;margin-top:10px"><summary class="mono">Dossier de la campagne</summary>
    ${Object.keys(r).length ? `<p style="margin-top:8px">${Object.entries(r).map(([k, v]) => `<b>${esc(k.replace(/_/g, ' '))}</b> : ${esc(v)}`).join('<br>')}</p>` : '<p class="msg">Brief absent.</p>'}
    ${b.priorite ? `<p class="msg" style="margin-top:8px">${esc(b.priorite)}</p>` : ''}
    ${(b.regles || []).length ? `<p class="msg">${b.regles.map(esc).join('<br>')}</p>` : ''}
    <p class="mono" style="margin-top:10px">Liens à déclarer à Whop (${liens.length})</p>
    ${liens.length ? `<textarea readonly style="min-height:90px">${esc(liens.join('
'))}</textarea>` : '<p class="msg">Aucun pour l'instant.</p>'}
  </details>`;
}
async function charger() {
  const d = await api('/api/clips');
  document.getElementById('demandes').innerHTML = d.demandes.length ? 'Demandes : ' + d.demandes.map((x) =>
    `n°${x.id} ${esc(x.campagne)} · <span class="${x.etat === 'fait' ? 'ok' : ''}">${ETATS[x.etat] || esc(x.etat)}</span>${x.message ? ' · ' + esc(x.message) : ''}`).join(' &nbsp;·&nbsp; ') : '';
  // on ne redessine les clips que s'il en arrive de nouveaux (sinon un lien en cours de saisie serait effacé)
  const sig = JSON.stringify(d.campagnes.map((c) => [c.campagne, c.clips.length, c.clips.map((k) => k.buffer.map((b) => b.etat).join())]));
  if (sig === charger.sig) return; charger.sig = sig;
  document.getElementById('campagnes').innerHTML = d.campagnes.map((c) => `
    <h2>${esc(c.brief && c.brief.nom || c.campagne)}</h2><p class="mono">${c.clips.length} clips</p>
    ${dossier(c)}
    <div class="grille">${c.clips.map((k) => `
      <div class="clip">
        <video src="${k.fichier}" controls preload="metadata" playsinline></video>
        <div class="corps">
          <b>${esc(k.titre)}</b><span class="mono">${k.duree} s</span>
          ${k.legendes ? `<div class="actions">${Object.keys(k.legendes).map((pl, i) => `<button class="vide${i ? '' : ' ok'}" data-pl="${esc(pl)}" data-txt="${esc(k.legendes[pl])}">${esc(NOMS[pl] || pl)}</button>`).join('')}</div>` : ''}
          <textarea readonly>${esc(k.legendes ? k.legendes[Object.keys(k.legendes)[0]] : k.legende)}</textarea>
          <div class="actions"><a href="${k.fichier}" download>Télécharger</a>
            <button class="vide" data-copie>Copier la légende</button>
            ${k.buffer.length ? '' : `<button data-buf data-c="${esc(c.campagne)}" data-k="${esc(k.clip)}">Programmer</button>`}</div>
          ${k.buffer.length ? `<p class="mono">${k.buffer.map((b) => `${esc(NOMS[b.plateforme] || b.plateforme)} : ${esc(ETATS_BUF[b.etat] || b.etat)}${b.etat === 'echec' && b.message ? ' (' + esc(b.message) + ')' : ''}`).join(' · ')}</p>` : ''}
          ${['tiktok', 'instagram', 'youtube'].map((p) => { const pub = k.publies.find((x) => x.plateforme === p);
            return `<div class="pub"><span>${NOMS[p]}</span><input placeholder="lien publié" value="${pub ? esc(pub.lien) : ''}"
              data-c="${esc(c.campagne)}" data-k="${esc(k.clip)}" data-p="${p}"><button class="vide" data-note>${pub ? (pub.declare_whop ? 'Whop ✓' : 'Noté') : 'Noter'}</button></div>`; }).join('')}
        </div>
      </div>`).join('')}</div>`).join('') || '<p class="msg" style="margin-top:24px">Aucun clip pour l\'instant.</p>';
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const doc = e.target.fichier.files[0];
  if (doc) {                                         // le document part en base64, lu côté serveur
    const b = new Uint8Array(await doc.arrayBuffer()); let s = '';
    for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode.apply(null, b.subarray(i, i + 32768));
    f.fichier = { nom: doc.name, b64: btoa(s) };
  } else delete f.fichier;
  if (!doc && !String(f.consignes || '').trim()) { document.getElementById('msg').textContent = 'Dépose le brief (document) ou colle-le.'; return; }
  const r = await api('/api/clips/demande', f);
  document.getElementById('msg').textContent = r.message;
  if (r.ok) { e.target.reset(); charger(); }
});
document.addEventListener('click', async (e) => {
  if (e.target.matches('[data-pl]')) {                // la légende de la plateforme choisie, avec son tag
    const corps = e.target.closest('.corps');
    corps.querySelector('textarea').value = e.target.dataset.txt;
    corps.querySelectorAll('[data-pl]').forEach((b) => b.classList.toggle('ok', b === e.target));
    return;
  }
  if (e.target.matches('[data-copie]')) {
    const t = e.target.closest('.corps').querySelector('textarea').value;
    try { await navigator.clipboard.writeText(t); e.target.textContent = 'Copiée'; } catch (err) { e.target.closest('.corps').querySelector('textarea').select(); }
  }
  if (e.target.matches('[data-buf]')) {              // programmé sur YouTube, TikTok et Instagram, le soir à New York
    const b = e.target;
    if (!confirm('Programmer ce clip sur YouTube, TikTok et Instagram (KinGKlip) ?')) return;
    b.disabled = true;
    const r = await api('/api/clips/buffer', { campagne: b.dataset.c, clip: b.dataset.k });
    alert(r.message); charger.sig = ''; charger();
    return;
  }
  if (e.target.matches('[data-ig]')) {               // publication directe sur @kinggklip : un clic = l'accord, clip par clip
    const b = e.target;
    if (!confirm('Publier ce clip sur Instagram (@kinggklip) maintenant ?')) return;
    b.disabled = true; b.textContent = 'Publication… (1 à 2 min)';
    const r = await api('/api/clips/instagram', { campagne: b.dataset.c, clip: b.dataset.k, legende: b.dataset.txt });
    if (r.ok) { b.textContent = 'Publié ✓'; charger.sig = ''; charger(); } else { b.disabled = false; b.textContent = 'Publier sur Instagram'; alert(r.message); }
    return;
  }
  if (e.target.matches('[data-note]')) {
    const i = e.target.previousElementSibling;
    if (e.target.textContent === 'Noté') { await api('/api/clips/whop', { campagne: i.dataset.c, clip: i.dataset.k, plateforme: i.dataset.p }); e.target.textContent = 'Whop ✓'; return; }
    const r = await api('/api/clips/publie', { campagne: i.dataset.c, clip: i.dataset.k, plateforme: i.dataset.p, lien: i.value });
    e.target.textContent = r.ok ? 'Noté' : '!'; if (!r.ok) alert(r.message);
  }
});
charger(); setInterval(charger, 30000);
</script>
</body>
</html>
