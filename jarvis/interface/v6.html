<style>
/* COCKPIT rAIme v6 EN DIRECT (15/10/2026) : la maquette validée, branchée sur /api/v6 (jarvis/v6.cjs) et sur de vrais boutons.
   Avant, la maquette v6 (14/10/2026) : Agents et Commerce en haut, Machine en bas ; la gouvernance (Directeur, Gouverneur des jetons, Gouverneur réflexif)
   dans la 3D ; les modèles d'IA (JEV compris) et leurs crédits dans les factures ; postuler en un clic ; « Renvoyer » sur chaque ligne d'appel ;
   l'e-mail par catégorie ; les clients = seulement les intéressés. Avant : v5 (08/10/2026). Trois rubriques : Machine (ce qui tourne, la 3D, les mises à jour, les factures), Agents (la vie de chaque
   agent : passé, présent, avenir, sous-agents, outils et jetons), Commerce (site web, intégration IA, agenda, clients).
   Tout est blanc, comme le reste : gris clair, surfaces blanches, le noir pour l'action. Aucune durée inventée : une estimation est marquée « estimé ». */
:root {
  --fond: #ECECEA; --surface: #FFFFFF; --surface-2: #F5F5F3; --encre: #121212; --encre-2: #3B3B39; --doux: #6B6B67; --pale: #A1A19D;
  --bord: rgba(18,18,18,.08); --noir: #121212; --sur-noir: #F5F5F2; --sur-noir-2: #A6A6A1; --survol: rgba(18,18,18,.045);
  --ok: #1E9A5E; --alerte: #C9820F; --panne: #D93C35; --info: #3756C9; --gris: #9C9C98;
  --ombre: 0 1px 1px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
  --police: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fond: #0F0F0F; --surface: #191918; --surface-2: #212120; --encre: #EDEDE9; --encre-2: #C9C9C5; --doux: #A3A39F; --pale: #6E6E6A;
  --bord: rgba(255,255,255,.08); --noir: #EDEDE9; --sur-noir: #121212; --sur-noir-2: #5E5E5A; --survol: rgba(255,255,255,.05);
  --ok: #45C385; --alerte: #E3A646; --panne: #F0645C; --info: #8AA3F0; --gris: #7A7A76; --ombre: 0 1px 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --fond: #0F0F0F; --surface: #191918; --surface-2: #212120; --encre: #EDEDE9; --encre-2: #C9C9C5; --doux: #A3A39F; --pale: #6E6E6A;
  --bord: rgba(255,255,255,.08); --noir: #EDEDE9; --sur-noir: #121212; --sur-noir-2: #5E5E5A; --survol: rgba(255,255,255,.05);
  --ok: #45C385; --alerte: #E3A646; --panne: #F0645C; --info: #8AA3F0; --gris: #7A7A76; --ombre: 0 1px 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.5 var(--police); color: var(--encre); background: var(--fond); -webkit-font-smoothing: antialiased; }
body.plein { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.menu { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--bord); overflow-y: auto; scrollbar-width: none; }
.menu::-webkit-scrollbar { display: none; }
.marque { display: flex; align-items: center; gap: 10px; padding: 0 10px 20px; font-weight: 800; font-size: 19px; letter-spacing: -.03em; }
.marque b { width: 32px; height: 32px; border-radius: 10px; background: var(--noir); color: var(--sur-noir); display: grid; place-items: center; font-size: 15px; }
.groupe { display: flex; flex-direction: column; gap: 1px; margin-bottom: 16px; }
.groupe > span { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--pale); padding: 0 12px 6px; }
.lien { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 12px; border: 0; background: none; text-align: left; color: var(--encre-2); font-weight: 600; }
.lien:hover { background: var(--survol); }
.lien[aria-current="page"] { background: var(--noir); color: var(--sur-noir); }
.lien .compte { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--survol); }
.lien[aria-current="page"] .compte { background: rgba(127,127,127,.3); }
.lien .compte.rouge { background: var(--panne); color: #fff; }
.menu .pied { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--bord); display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.menu .pied i { width: 34px; height: 34px; border-radius: 50%; background: var(--noir); color: var(--sur-noir); display: grid; place-items: center; font-style: normal; font-weight: 700; flex: none; }
.menu .pied div { line-height: 1.25; } .menu .pied small { color: var(--doux); font-size: 11.5px; }
.menu .pied button { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--bord); background: none; display: grid; place-items: center; }

main { min-width: 0; padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 20px; }
body.plein main { padding-bottom: 20px; }
.entete { display: flex; align-items: center; gap: 16px; min-height: 52px; }
.entete .titre { min-width: 0; flex: 1; }
.entete h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entete p { margin: 2px 0 0; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outils-entete { display: flex; align-items: center; gap: 8px; flex: none; }
.cherche { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--bord); width: 230px; }
.cherche input { border: 0; outline: none; background: none; width: 100%; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--bord); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--encre); }
.btn.noir { background: var(--noir); color: var(--sur-noir); border-color: var(--noir); }
.btn.petit { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 16px; }
.btn.discret { border-color: transparent; background: none; color: var(--doux); }
.btn.discret:hover { color: var(--encre); background: var(--survol); }
.btn:disabled { opacity: .45; cursor: default; }
.raison { font-size: 12px; color: var(--doux); }
.date-txt { font-size: 11.5px; color: var(--pale); font-weight: 600; }
.alerte-lecture { border-left: 4px solid var(--alerte); padding: 12px 18px; font-size: 13px; }
.rond.noir.actif { background: var(--panne); border-color: var(--panne); }
.rond { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--bord); background: var(--surface); display: grid; place-items: center; flex: none; }
.rond.noir { background: var(--noir); color: var(--sur-noir); border-color: var(--noir); }

.carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 22px; box-shadow: var(--ombre); }
.carte-tete { display: flex; align-items: center; gap: 10px; padding: 18px 20px 8px; }
.carte-tete h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.carte-tete .plus { margin-left: auto; }
.etiq { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.point { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.point.ok { background: var(--ok); } .point.alerte { background: var(--alerte); } .point.panne { background: var(--panne); } .point.info { background: var(--info); } .point.gris { background: var(--gris); }
.puce { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--survol); color: var(--encre-2); white-space: nowrap; }
.puce.ok { color: var(--ok); } .puce.alerte { color: var(--alerte); } .puce.panne { color: var(--panne); } .puce.info { color: var(--info); }
.vide { padding: 34px 20px; text-align: center; color: var(--doux); }
.note { color: var(--doux); font-size: 13px; margin: 0; }
.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.chiffre { padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--bord); }
button.chiffre:hover { border-color: var(--encre); }
.chiffre b { font-size: 32px; font-weight: 600; letter-spacing: -.04em; line-height: 1.1; }
.chiffre small { color: var(--doux); }
.chiffre.noir { background: var(--noir); color: var(--sur-noir); border-color: var(--noir); } .chiffre.noir small, .chiffre.noir .etiq { color: var(--sur-noir-2); }
.trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.deux { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; }
.filtre { height: 36px; padding: 0 15px; border-radius: 18px; border: 1px solid var(--bord); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.filtre b { font-weight: 800; }
.filtre[aria-pressed="true"] { background: var(--noir); color: var(--sur-noir); border-color: var(--noir); }
.bandeau { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.bandeau .cherche { margin-left: auto; width: 250px; }

/* les outils et leurs jetons, en petit, en haut à droite */
.outils { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.outil { display: inline-flex; align-items: baseline; gap: 5px; padding: 2px 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--bord); font-size: 11px; font-weight: 600; color: var(--encre-2); white-space: nowrap; }
.outil i { font-style: normal; font-weight: 500; color: var(--doux); }
.outil.ia i { color: var(--info); } .outil.ancien i { color: var(--pale); }

/* ── état des agents ── */
.colonne { padding-bottom: 8px; }
.colonne > header { display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px; }
.colonne > header h2 { margin: 0; font-size: 15px; font-weight: 700; }
.colonne > header .num { margin-left: auto; font-weight: 800; font-size: 13px; color: var(--doux); }
.ligne-a { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 11px 20px; border: 0; border-top: 1px solid var(--bord); background: none; text-align: left; }
.ligne-a:hover { background: var(--surface-2); }
.ligne-a .point { align-self: center; }
.ligne-a b { font-weight: 700; font-size: 13.5px; overflow-wrap: break-word; }
.ligne-a .quand { font-size: 12px; font-weight: 700; color: var(--doux); text-align: right; max-width: 150px; }
.ligne-a .quand.rouge { color: var(--panne); }
.ligne-a small { grid-column: 2 / -1; color: var(--doux); font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ligne-a em { font-style: normal; color: var(--pale); font-weight: 600; font-size: 11.5px; }

/* la fiche vivante d'un agent (3D et tiroir) */
.vivant { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 9px 12px; margin: 0; font-size: 13px; line-height: 1.45; }
.vivant dt { color: var(--doux); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
.vivant dd { margin: 0; min-width: 0; }
.vivant dd.rouge { color: var(--panne); }

/* ── vue 3D, toute blanche ── */
.v3 { position: relative; height: calc(100vh - 116px); min-height: 520px; border-radius: 22px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--bord); }
.v3 canvas { display: block; width: 100%; height: 100%; }
.v3-etiquettes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.v3-et { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none; transition: opacity .15s; }
.v3-et.quartier { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--encre); }
.v3-et.secteur { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--doux); }
.v3-et.agent { font-size: 12px; font-weight: 700; color: var(--sur-noir); background: var(--noir); padding: 4px 9px; border-radius: 8px; }
.v3-nav { position: absolute; top: 14px; left: 14px; display: flex; gap: 2px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--bord); box-shadow: var(--ombre); }
.v3-nav button { border: 0; background: none; height: 30px; padding: 0 11px; border-radius: 10px; font-weight: 700; font-size: 12px; color: var(--doux); }
.v3-nav button:hover { color: var(--encre); background: var(--survol); }
.v3-nav button[aria-pressed="true"] { background: var(--noir); color: var(--sur-noir); }
.v3-legende { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 14px; font-size: 11.5px; color: var(--doux); font-weight: 600; }
.v3-legende span { display: inline-flex; align-items: center; gap: 6px; }
.v3-zoom { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; }
.v3-zoom button { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--bord); background: var(--surface); box-shadow: var(--ombre); font-size: 16px; font-weight: 700; display: grid; place-items: center; }
.v3-carte { position: absolute; top: 14px; right: 14px; width: 372px; max-height: calc(100% - 78px); overflow: hidden; padding: 18px 20px 18px; display: none; flex-direction: column; gap: 14px;
  background: var(--surface); border: 1px solid var(--bord); border-radius: 20px; box-shadow: 0 18px 48px rgba(0,0,0,.12); }
.v3-carte.vue { display: flex; }
.v3-carte .vivant dd { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.tete-ag { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: start; }
.tete-ag h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.tete-ag .sous { color: var(--doux); font-size: 12.5px; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.v3-fermer { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--bord); background: none; display: grid; place-items: center; }
.v3-erreur { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--doux); }

/* ── pages d'agents ── */
.bandeau-ag { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 46%); gap: 16px; align-items: start; padding: 18px 20px; }
.bandeau-ag p { margin: 6px 0 0; font-size: 15px; font-weight: 600; line-height: 1.45; letter-spacing: -.01em; }
.bandeau-ag .outils { padding-top: 2px; }
.temps { list-style: none; margin: 0; padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 12px; container-type: inline-size; }
@container (max-width: 360px) { ol.temps li { grid-template-columns: 1fr; gap: 2px; } }
.temps li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; font-size: 13px; line-height: 1.45; }
.temps time { color: var(--doux); font-weight: 700; font-size: 12px; }
.temps.present time { color: var(--encre); }
.explication { padding: 18px 22px; border-left: 4px solid var(--panne); }
.explication ol { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; line-height: 1.5; }
.tableau { width: 100%; border-collapse: collapse; }
.tableau th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pale); padding: 10px 16px; border-bottom: 1px solid var(--bord); white-space: nowrap; }
.tableau td { padding: 12px 16px; border-bottom: 1px solid var(--bord); vertical-align: top; font-size: 13px; }
.tableau tr:last-child td { border-bottom: 0; }
.tableau tbody tr.cliquable { cursor: pointer; } .tableau tbody tr.cliquable:hover td { background: var(--surface-2); }
.tableau .qui b { display: block; font-weight: 700; } .tableau .qui small { color: var(--doux); }
.tableau td.droite, .tableau th.droite { text-align: right; white-space: nowrap; }
.tableau tr.niveau2 td:first-child { padding-left: 40px; }
.tableau tr.niveau2 td:first-child b::before { content: ''; display: inline-block; width: 9px; height: 8px; margin-right: 8px; border-left: 1.5px solid var(--pale); border-bottom: 1.5px solid var(--pale); transform: translateY(-3px); }
.tableau .outils { justify-content: flex-start; }
.defile { overflow-x: auto; }
.listes { list-style: none; margin: 0; padding: 2px 20px 18px; display: flex; flex-direction: column; gap: 9px; font-size: 13px; line-height: 1.45; }
.listes li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; }
.listes li .point { margin-top: 5px; }
.schema { display: grid; grid-template-columns: 1fr 28px 1fr 28px 1fr; align-items: stretch; padding: 6px 20px 20px; }
.schema .etape-s { padding: 16px; border-radius: 16px; background: var(--surface-2); font-size: 13px; line-height: 1.5; }
.schema .etape-s b { display: block; font-size: 14px; margin-bottom: 4px; }
.schema .etape-s.noire { background: var(--noir); color: var(--sur-noir); }
.schema .fleche { display: grid; place-items: center; color: var(--pale); font-size: 20px; font-weight: 700; }

/* ── commerce : liste d'appels ── */
.appels { display: flex; flex-direction: column; gap: 10px; container-type: inline-size; }
.section-appels > h3 { margin: 6px 4px 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.section-appels > h3 .num { color: var(--encre); }
.section-appels > h3 small { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--pale); }
/* la carte d'appel s'adapte à la largeur réelle de la liste (et non de l'écran) : le nom du commerce n'est jamais écrasé par les boutons */
.appel { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'qui num' 'ctx ctx' 'res res'; gap: 8px 18px; align-items: center; padding: 14px 18px; }
@container (min-width: 1020px) { .appel { grid-template-columns: minmax(240px, 1fr) 190px auto; grid-template-areas: 'qui num res' 'ctx ctx ctx'; } .appel .resultat { justify-content: flex-end; } }
.appel .qui { grid-area: qui; min-width: 0; } .appel .numero { grid-area: num; } .appel .resultat { grid-area: res; } .appel .contexte { grid-area: ctx; }
.appel .qui b { display: block; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appel .qui small { color: var(--doux); }
.appel .contexte { font-size: 12.5px; color: var(--doux); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.appel .contexte a { color: var(--info); font-weight: 700; text-decoration: none; }
.appel .note-rdv { width: 100%; padding: 9px 12px; border-radius: 12px; background: var(--surface-2); color: var(--encre); font-size: 13px; }
.numero { display: flex; align-items: center; gap: 6px; }
.numero span { font-size: 18px; font-weight: 600; letter-spacing: .01em; user-select: all; white-space: nowrap; }

// noter un appel : /api/v6/appel (l'agenda et la liste d'appels du serveur) ; puis tout est relu
async function noterAppel(cle, res, jour, note) {
  const c = C.find((x) => x.cle === cle); if (!c) return;
  const boutons = $$(`[data-cle="${cle}"] button`); boutons.forEach((b) => { b.disabled = true; });
  const resultat = { interesse: 'interesse', non: 'pas_interesse', pasjoint: 'pas_joint', rappeler: 'rappeler' }[res];
  try {
    const d = await poster('/api/v6/appel/' + cle, resultat === 'rappeler' ? { resultat, echeance: jour, note: note || null } : { resultat });
    const suite = d.suivant ? quand(d.suivant.jour) : null;
    const msg = resultat === 'rappeler' ? (note ? `${c.nom} : à l’agenda ${quand(jour)}, avec ta note` : `${c.nom} : revient dans ta liste d’appels ${quand(jour)}`)
      : resultat === 'interesse' ? `${c.nom} : intéressé, noté${suite ? ' ; relance ' + suite : ''}` : resultat === 'pas_joint' ? `${c.nom} : pas joint${suite ? ', il revient dans ta liste ' + suite : ''}`
      : `${c.nom} : pas intéressé, noté`;
    ouvertRappel = null; toast(msg); await charger(false);
  } catch (e) { boutons.forEach((b) => { if (b.isConnected) b.disabled = false; }); toast(`${c.nom} : ${e.message}`); }
}

let vue = 'siteweb';
const PAGES = { etat, vue3d, majs, factures, siteweb, integration, agenda, clients, clipping: () => pageAgent('clipping'), trading: () => pageAgent('trading'), dropshipping: () => pageAgent('dropshipping'), libre: () => pageAgent('libre'), candidatures: () => pageAgent('candidatures') };

function aller(v) { fermerTiroir(); if (v !== vue) { vue = v; ouvertRappel = null; window.scrollTo(0, 0); } rendre(); }
function brancher() {
  const v = $('#vue');
  $$('.ligne-a[data-agent]', v).forEach((b) => b.onclick = () => ficheAgent(AG.find((a) => a.id === b.dataset.agent)));
  $$('[data-jourl]', v).forEach((b) => b.onclick = () => { jourListe = b.dataset.jourl; ouvertRappel = null; rendre(); });
  $$('[data-res]', v).forEach((b) => b.onclick = () => { const cle = b.closest('[data-cle]').dataset.cle; if (b.dataset.res === 'rappeler') { ouvertRappel = ouvertRappel === cle ? null : cle; rendre(); const n = $('#r-note'); if (n) n.focus(); } else noterAppel(cle, b.dataset.res); });

  const rn = $('#r-note'); if (rn) rn.onkeydown = (e) => { if (e.key === 'Enter') $('[data-noter]').click(); };

  const tc = $('#tout-choisir'); if (tc) tc.onclick = () => { const l = D.brouillons.filter((k) => !envoyes.has(k)); if (choisis.size === l.length) choisis.clear(); else l.forEach((k) => choisis.add(k)); rendre(); };
  const ec = $('#envoyer-choix'); if (ec) ec.onclick = async () => {

    toast(`${ok} e-mail${ok > 1 ? 's' : ''} validé${ok > 1 ? 's' : ''} : l’Expéditeur les envoie à son prochain passage, à 8 h${refus.length ? ' ; refusé : ' + refus.join(', ') : ''}`); await charger(false); };
  const pr = $('#prec'), su = $('#suiv'); const dec = (s) => { const d = new Date(curseur + 'T12:00:00'); d.setMonth(d.getMonth() + s, 1); curseur = isoDe(d); rendre(); };
  if (pr) { pr.onclick = () => dec(-1); su.onclick = () => dec(1); }
  $$('[data-rappel]', v).forEach((b) => b.onclick = () => { const r = RAPPELS.find((x) => x.id === Number(b.dataset.rappel)); const c = r && C.find((x) => x.cle === r.cle); if (c) fiche(c); });

      try { await poster('/api/agenda/' + r.id, { action: 'reporter', echeance: c.dataset.jour }); toast(`${r.nom} reporté ${quand(c.dataset.jour)}`); await charger(false); } catch (err) { toast(`${r.nom} : ${err.message}`); } }); });

  const a = e.target.closest('[data-aller]'); if (a) return aller(a.dataset.aller);

$('#cherche-global').addEventListener('keydown', (e) => { if (e.key === 'Enter') chercherPartout(e.target.value); });
let ecoute = null;
function parler(texte) {
  const t = String(texte || '').replace(/https?:\/\/\S+/g, '').slice(0, 1600); if (!t) return;
  fetch('/api/voix/parler', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texte: t }) })
    .then((r) => { if (!r.ok) throw new Error('voix'); return r.blob(); })
    .then((b) => { const u = URL.createObjectURL(b), a = new Audio(u); a.onended = () => URL.revokeObjectURL(u); return a.play(); })
    .catch(() => { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; speechSynthesis.cancel(); speechSynthesis.speak(u); } });
}
$('#micro').onclick = async () => {
  if (ecoute) { ecoute.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { toast('Pas de micro sur ce navigateur'); return; }
  let flux; try { flux = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); } catch (e) { toast('Micro refusé'); return; }
  const rec = new MediaRecorder(flux), morceaux = [], b = $('#micro'); ecoute = rec;
  b.classList.add('actif'); b.setAttribute('aria-label', 'Arrêter et envoyer à Jarvis'); toast('Je t’écoute : touche le micro quand tu as fini');
  rec.ondataavailable = (e) => { if (e.data.size) morceaux.push(e.data); };
  rec.onstop = async () => {
    flux.getTracks().forEach((t) => t.stop()); ecoute = null; b.classList.remove('actif'); b.setAttribute('aria-label', 'Parler à Jarvis');
    try {
      const t = await fetch('/api/voix/transcrire', { method: 'POST', body: new Blob(morceaux, { type: rec.mimeType || 'audio/webm' }) }).then((r) => r.json());
      const dit = String(t.texte || '').trim(); if (!dit) { toast('Je n’ai rien entendu'); return; }
      toast('Jarvis réfléchit…');
      const d = await poster('/api/dire', { message: dit, oral: true });
      tiroir('Jarvis', '« ' + dit + ' »', 'Sa réponse', `<div class="lettre">${esc(d.reply || '(pas de réponse)')}</div>`); parler(d.reply);
      if (d.commande) await charger(false);
    } catch (e) { toast('La voix du serveur ne répond pas'); }
  };
  rec.start(250); setTimeout(() => { if (ecoute === rec) rec.stop(); }, 60000);
};
$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = sombre() ? 'light' : 'dark'; try { localStorage.setItem('cockpit-theme', r.dataset.theme); } catch (e) {} if (vue === 'vue3d') { demonter3d(); rendre(); } };
// blanc par défaut, comme le reste du site ; le bouton du bas du menu passe en sombre
{ let t = null; try { t = localStorage.getItem('cockpit-theme'); } catch (e) {} document.documentElement.dataset.theme = t || 'light'; }
// écrire exige l'en-tête maison (jarvis/serveur.cjs : une autre page ne peut pas l'envoyer)
const ECRIRE = { 'Content-Type': 'application/json', 'X-Jarvis': '1' };
async function poster(url, data, bouton) {
  if (bouton) bouton.disabled = true;
  try {
    const r = await fetch(url, { method: 'POST', headers: ECRIRE, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.erreur || (r.status === 403 ? 'refusé par le cockpit' : 'le cockpit ne répond pas (' + r.status + ')'));
    return j;
  } finally { if (bouton && bouton.isConnected) bouton.disabled = false; }
}
let enLecture = false;
async function charger(premier) {
  if (enLecture) return; enLecture = true;
  try {
    const r = await fetch('/api/v6', { cache: 'no-store' });
    if (!r.ok) throw new Error('le cockpit répond ' + r.status);
    installer(await r.json());
    rendre();
  } catch (e) {
    if (premier) { $('#vue').innerHTML = `<div class="carte vide">Les données n’ont pas pu être lues : ${esc(e.message)}.<br><br><button class="btn petit" type="button" id="relire">Réessayer</button></div>`; $('#relire').onclick = () => charger(true); }
    else toast('Données non relues : ' + e.message);
  } finally { enLecture = false; }
}
// la relecture régulière n'interrompt jamais un geste en cours (saisie, tiroir, fenêtre, formulaire de rappel)
const occupe = () => $('#tiroir').classList.contains('ouvert') || $('#fenetre').classList.contains('ouverte') || ouvertRappel || ecoute
  || ['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName);
setInterval(() => { if (document.visibilityState === 'visible' && D && !occupe()) charger(false); }, 120000);
charger(true);
