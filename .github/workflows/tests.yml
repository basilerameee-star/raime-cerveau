# Le banc d'essai sur chaque pull request : deux bases Postgres de test, le modèle
# factice, aucune clé. Une pull request rouge ne se fusionne pas.
name: Banc d'essai

on:
  pull_request:
  # Appelé aussi par deployer.yml : rien ne part au serveur sans ce banc au vert.
  workflow_call:

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raime
          # mot de passe jetable d'une base de test qui disparaît avec la tâche
          POSTGRES_PASSWORD: banc
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raime"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: raime
      PGPASSWORD: banc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # La porte web : la signature de GitHub est vérifiée par du code, donc par un test.
      - run: python3 -m unittest tests/banc/porte_http_test.py
      # Ce que l'Envoyeur répond dans un formulaire (salaire, visa, Oui/Non) : 08/10/2026
      - run: python3 -m unittest tests/banc/envoyeur_test.py
      # Le vérificateur des clips (08/10/2026) : après npm test, qui a préparé les bases ; son passage complet y écrit.
      - run: python3 -m unittest tests/banc/verificateur_clips_test.py
      # Le pilote des clips KinGKlip (15/10/2026) : grille des campagnes, réserve, alternance et quota de Buffer.
      - run: python3 -m unittest tests/banc/pilote_clips_test.py
