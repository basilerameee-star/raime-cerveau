# LA LIVRAISON — chaque fusion sur main part en ligne toute seule, si et seulement si
# le banc d'essai passe. Le code voyage en archive jusqu'à la porte du serveur
# (https://cockpit.raime.fr/porte/), qui le passe à porte/porte.sh.
#
# AUCUN SECRET. GitHub signe pour chaque passage un jeton (OIDC) qui dit quel dépôt, quelle
# branche et quelle action livrent ; la porte vérifie cette signature avec la clé publique
# de GitHub (porte/porte_http.py). Rien à copier, rien qui puisse fuir. Si la porte ne
# répond pas, la livraison s'arrête proprement avec un avertissement.
name: Livraison

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Version main attendue (livraison autonome)'
        required: false
        type: string

concurrency:
  group: livraison
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  banc:
    uses: ./.github/workflows/tests.yml

  deployer:
    needs: banc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # pour écrire une ligne au carnet si la version revient en arrière
      id-token: write   # pour que GitHub signe le jeton qui ouvre la porte
    env:
      PORTE_URL: https://cockpit.raime.fr/porte
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la version demandée
        env:
          SHA_ATTENDU: ${{ inputs.sha }}
        run: |
          if [ -n "$SHA_ATTENDU" ] && [ "$SHA_ATTENDU" != "$GITHUB_SHA" ]; then
            echo '::error::main a changé depuis la sandbox ; cette livraison ne part pas.'
            exit 1
          fi

      - name: La porte est-elle prête ?
        id: porte
        run: |
          if curl -fsS --max-time 15 "$PORTE_URL/sante" | grep -q 'porte prête'; then
            echo "prete=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::error::La porte du serveur ne répond pas ($PORTE_URL/sante). Rien n'est envoyé."
            echo "prete=non" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Envoyer la version par la porte
        id: envoi
        if: steps.porte.outputs.prete == 'oui'
        run: |
          jeton=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=raime-porte" | jq -r .value)
          git archive --format=tar.gz HEAD -o version.tar.gz
          set +e
          curl -sS --no-buffer --max-time 1700 -X POST \
               -H "Authorization: Bearer $jeton" -H "Content-Type: application/gzip" \
               --data-binary @version.tar.gz "$PORTE_URL/livrer?sha=$GITHUB_SHA" | tee porte.log
          set -e
          code=$(sed -n 's/^code=//p' porte.log | tail -n1)
          code=${code:-1}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Vérifier depuis l'extérieur
        if: steps.envoi.outcome == 'success'
        run: |
          for conf in services/*/service.conf; do
            [ -f "$conf" ] || continue
            nom=$(basename "$(dirname "$conf")")
            chemin=$(sed -n 's/^chemin=//p' "$conf" | head -n1); contient=$(sed -n 's/^contient=//p' "$conf" | head -n1)
            if curl -fsS --max-time 20 "https://$nom.raime.fr${chemin:-/}" | grep -qF -- "$contient"; then
              echo "✓ https://$nom.raime.fr répond ce qu'il doit" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::https://$nom.raime.fr ne répond pas encore de l'extérieur (DNS ?). Le serveur, lui, l'a vérifié."
            fi
          done

      - name: Écrire le retour en arrière au carnet
        if: failure() && steps.envoi.outputs.code != ''
        run: |
          {
            echo
            echo "## $(date -u +%F) — livraison — échec, retour automatique"
            echo "- Action : déploiement de ${GITHUB_SHA:0:12} par la porte."
            echo "- Résultat : code ${{ steps.envoi.outputs.code }} (3 = version précédente remise, 4 = aucune version précédente)."
            echo "- Évaluation : $(grep -E 'ÉCHEC|RETOUR|REFUS' porte.log | tail -n 2 | sed 's/^[0-9TZ:-]* //' | tr '\n' ' ')"
            echo "- Correction : aucune version cassée ne reste en ligne ; la cause est à traiter dans une nouvelle pull request."
            echo "- Leçon : à tirer par la session suivante."
          } >> carnet/CARNET.md
          git config user.name "livraison-raime"
          git config user.email "livraison@raime.invalid"
          git add carnet/CARNET.md
          git commit -m "Carnet : retour automatique après l'échec de ${GITHUB_SHA:0:12}"
          git pull --rebase origin main && git push origin HEAD:main

