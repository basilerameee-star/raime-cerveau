<html lang="fr" data-theme="bleu">

<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/InterVariable.woff2) format("woff2")}
:root{--encre:#fff;--texte:#f2e8ee;--gris:#e2d0da}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;color:var(--texte);
  background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,
             linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,
             linear-gradient(118deg,#6e5569 0%,#8c7187 38%,#ab8fa4 70%,#cfa9ba 100%) fixed}
header{padding:22px clamp(20px,5vw,72px)}
header img{height:38px;width:auto;display:block}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,5vw,72px) 80px;max-width:820px}
.etiq{margin:0 0 18px;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
h1{margin:0;font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.045em;font-weight:650;color:var(--encre)}
h1 em{display:block;font-weight:400;color:#cfd4dc}
p{font-size:clamp(16px,1.4vw,19px);line-height:1.6;margin:24px 0 0;max-width:46ch}
.actions{margin-top:36px;display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px}
.bouton{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 28px;border-radius:999px;background:#f5d0d8;color:#3d2437;
  font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 14px 30px -16px rgba(3,10,30,.8);transition:transform .3s,background-color .3s}
.bouton:hover{background:#fbe1e6;transform:translateY(-2px)}
.bouton svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lien{color:var(--encre);font-size:15px;font-weight:500;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:2px}
.lien:hover{border-color:#fff}
.petit{margin-top:40px;font-size:14px;color:var(--gris)}
.petit a{color:var(--encre);text-decoration:none}

<header><a href="/" aria-label="rAIme, accueil"><img src="/logo-mark-blanc.png" alt="rAIme"></a></header>

  <p class="petit">Une question ? <a href="mailto:contact@raime.fr">contact@raime.fr</a></p>
