340\" y=\"138\" text-anchor=\"middle\">choisit · forme · mesure</text><rect class=\"pm-noeud\" x=\"260\" y=\"370\" width=\"160\" height=\"54\" rx=\"10\"/><text class=\"pm-titre\" x=\"340\" y=\"393\" text-anchor=\"middle\">FREINS</text><text class=\"pm-sous\" x=\"340\" y=\"408\" text-anchor=\"middle\">compétences, données, coûts</text><rect class=\"pm-panneau\" x=\"470\" y=\"20\" width=\"180\" height=\"170\" rx=\"10\"/><text class=\"pm-titre\" x=\"482\" y=\"42\">USAGES</text><text class=\"pm-ligne\" x=\"482\" y=\"68\">Analyser des textes</text><text class=\"pm-ligne\" x=\"638\" y=\"68\" text-anchor=\"end\">56 %</text><rect class=\"pm-fond\" x=\"482\" y=\"76\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"76\" width=\"87\" height=\"3\" style=\"transition-delay:0ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"102\">Générer texte, voix</text><text class=\"pm-ligne\" x=\"638\" y=\"102\" text-anchor=\"end\">43 %</text><rect class=\"pm-fond\" x=\"482\" y=\"110\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"110\" width=\"67\" height=\"3\" style=\"transition-delay:140ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"136\">Images, vidéo, son</text><text class=\"pm-ligne\" x=\"638\" y=\"136\" text-anchor=\"end\">41 %</text><rect class=\"pm-fond\" x=\"482\" y=\"144\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"144\" width=\"64\" height=\"3\" style=\"transition-delay:280ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"170\">Transcrire la voix</text><text class=\"pm-ligne\" x=\"638\" y=\"170\" text-anchor=\"end\">34 %</text><rect class=\"pm-fond\" x=\"482\" y=\"178\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"178\" width=\"53\" height=\"3\" style=\"transition-delay:420ms\"/><rect class=\"pm-panneau\" x=\"470\" y=\"284\" width=\"180\" height=\"136\" rx=\"10\"/><text class=\"pm-titre\" x=\"482\" y=\"306\">OBJECTIFS</text><text class=\"pm-ligne\" x=\"482\" y=\"332\">Optimiser les coûts</text><text class=\"pm-ligne\" x=\"638\" y=\"332\" text-anchor=\"end\">73 %</text><rect class=\"pm-fond\" x=\"482\" y=\"340\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"340\" width=\"114\" height=\"3\" style=\"transition-delay:560ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"366\">Qualité, fiabilité</text><text class=\"pm-ligne\" x=\"638\" y=\"366\" text-anchor=\"end\">64 %</text><rect class=\"pm-fond\" x=\"482\" y=\"374\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"374\" width=\"100\" height=\"3\" style=\"transition-delay:700ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"400\">Travaux complexes</text><text class=\"pm-ligne\" x=\"638\" y=\"400\" text-anchor=\"end\">56 %</text><rect class=\"pm-fond\" x=\"482\" y=\"408\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"408\" width=\"87\" height=\"3\" style=\"transition-delay:840ms\"/><text class=\"pm-rel\" x=\"108\" y=\"105\" text-anchor=\"start\">fabriquent</text><text class=\"pm-rel\" x=\"108\" y=\"215\" text-anchor=\"start\">animent</text><text class=\"pm-rel\" x=\"214\" y=\"259\" text-anchor=\"middle\">équipent</text><text class=\"pm-rel\" x=\"222\" y=\"118\" text-anchor=\"middle\">compare</text><text class=\"pm-rel\" x=\"332\" y=\"196\" text-anchor=\"end\">accompagne</text><text class=\"pm-rel\" x=\"446\" y=\"212\" text-anchor=\"end\">s'en servent pour</text><text class=\"pm-rel\" x=\"452\" y=\"330\" text-anchor=\"middle\">visent</text><text class=\"pm-rel\" x=\"348\" y=\"340\" text-anchor=\"start\">butent sur</text></svg><div class=\"pm-m\" aria-hidden=\"true\"><div class=\"pm-m-noeud\"><b>LABORATOIRES</b><span>OpenAI, Google, Mistral…</span></div><p class=\"pm-m-rel\">↓ fabriquent</p><div class=\"pm-m-noeud\"><b>MODÈLES</b><span>506 suivis chaque nuit</span></div><p class=\"pm-m-rel\">↓ animent</p><div class=\"pm-m-noeud\"><b>OUTILS D'IA</b><span>assistants, agents</span></div><p class=\"pm-m-rel\">↓ équipent</p><div class=\"pm-m-noeud pm-m-centre\"><b>ENTREPRISES</b><span>18 % en France · 58 % des 250 salariés et +</span></div><p class=\"pm-m-rel\">s'en servent pour ↓</p><div class=\"pm-m-panneau\"><b>USAGES</b><p><span>Analyser des textes</span><i>56 %</i><s><u style=\"width:56%\"></u></s></p><p><span>Générer texte, voix</span><i>43 %</i><s><u style=\"width:43%\"></u></s></p><p><span>Images, vidéo, son</span><i>41 %</i><s><u style=\"width:41%\"></u></s></p><p><span>Transcrire la voix</span><i>34 %</i><s><u style=\"width:34%\"></u></s></p></div><p class=\"pm-m-rel\">visent ↓</p><div class=\"pm-m-panneau\"><b>OBJECTIFS</b><p><span>Optimiser les coûts</span><i>73 %</i><s><u style=\"width:73%\"></u></s></p><p><span>Qualité, fiabilité</span><i>64 %</i><s><u style=\"width:64%\"></u></s></p><p><span>Travaux complexes</span><i>56 %</i><s><u style=\"width:56%\"></u></s></p></div><p class=\"pm-m-rel\">butent sur ↓</p><div class=\"pm-m-noeud\"><b>FREINS</b><span>compétences, données, coûts</span></div><p class=\"pm-m-rel\">+</p><div class=\"pm-m-noeud pm-m-raime\"><b>rAIme</b><span>choisit · forme · mesure</span></div></div><figcaption>Pourcentages : part des entreprises qui utilisent l'IA (Insee, 2025)</figcaption></figure></div></section><section class=\"pc-bloc-freins pc-apparait\"><p class=\"pc-num\" aria-hidden=\"true\">01</p><p class=\"pc-mono\">Ce qui bloque</p><h2>Ce qui <em>les freine.</em></h2><p class=\"pc-freins-intro\">Beaucoup essaient l'IA, peu en tirent un vrai gain. Chaque obstacle a sa réponse.</p><div class=\"pc-freins\"><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Utilité</span><b>71 %</b><h3>des entreprises sans IA ne voient pas à quoi elle leur servirait.</h3><p class=\"pc-frein-rep\">→ L'audit des postes montre où l'IA vous fait gagner des heures.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Compétences</span><b>54 %</b><h3>des entreprises sans IA disent manquer d'expertise.</h3><p>Et 53 % de celles qui l'utilisent en sont freinées.</p><p class=\"pc-frein-rep\">→ La formation, sur vos propres cas.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Données</span><b>43 %</b><h3>des entreprises qui utilisent l'IA craignent pour la protection de leurs données.</h3><p class=\"pc-frein-rep\">→ Vos outils sur un serveur que vous contrôlez.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Coûts</span><b>33 %</b><h3>des entreprises qui utilisent l'IA jugent les coûts trop élevés.</h3><p class=\"pc-frein-rep\">→ Le bon modèle à chaque tâche, au juste prix.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Résultats</span><b>60 %</b><h3>des entreprises dans le monde ne tirent presque aucune valeur de leurs investissements en IA.</h3><p class=\"pc-frein-rep\">→ Chaque proposition lue et notée avant de signer.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Passage à l'échelle</span><b>Près de 2/3</b><h3>des organisations n'ont pas encore étendu l'IA à toute l'entreprise.</h3><p class=\"pc-frein-rep\">→ Un suivi chaque mois, de l'essai à l'usage.</p></div></div><p class=\"pc-sources\">Sources : Insee, enquête TIC 2025, entreprises de 10 salariés ou plus (71, 54, 43, 33 %) · BCG, The Widening AI Value Gap, septembre 2025 (60 %) · McKinsey, The State of AI, 2025 (2/3)</p></section><div class=\"pc-intro pc-apparait\"><p class=\"pc-mono\">L'IA, vue de près</p><h2>Ce qui se passe derrière <em>une réponse.</em></h2><p>Choisir l'IA, la payer au juste prix, bien s'en servir. Tous les chiffres viennent des mesures de rAIme.</p></div><section class=\"pc-bloc pc-apparait\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">02</p><p class=\"pc-mono\">Les jetons</p><h2>Tout se compte <em>en jetons.</em></h2><p>L'IA lit et écrit par morceaux de mots : les jetons. Chacun est facturé. Lire un million de jetons coûte de 0,017 $ à 0,78 $ selon le modèle : jusqu'à 46 fois plus, pour le même travail.</p></div><div class=\"pc-visuel\"><div class=\"pc-jetons\"><span style=\"--i:0\">Rés</span><span style=\"--i:1\">ume</span><span style=\"--i:2\">ce</span><span style=\"--i:3\">contrat</span><span style=\"--i:4\">en</span><span style=\"--i:5\">trois</span><span style=\"--i:6\">points</span><span style=\"--i:7\">.</span></div><p class=\"pc-legende\">Exemple : 6 mots, 8 jetons.</p></div></section><section class=\"pc-bloc pc-apparait pc-bloc--inverse\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">03</p><p class=\"pc-mono\">La demande</p><h2>Une demande claire coûte <em>moins cher.</em></h2><p>Une demande floue fait tâtonner l'IA : plus d'essais, plus de jetons, un résultat moyen. Chez rAIme, une demande réécrite et un réglage corrigé : de 0 à 3 messages réussis sur 3, pour un coût divisé par cinq.</p></div><div class=\"pc-visuel\"><div class=\"pc-prompts\"><div class=\"pc-prompt\"><b>Avant <i>0 réussi sur 3</i></b><p>« Ne pose aucune question. » … puis, plus loin : « Termine par une question. »</p></div><div class=\"pc-prompt pc-prompt--apres\"><b>Après <i>3 sur 3 · coût ÷ 5</i></b><p>« Une seule demande, claire. Six à dix lignes. Aucun prix. »</p></div></div></div></section><div class=\"pc-grands pc-apparait\"><div><b>46 fois</b><span>plus cher, pour le même travail : 1 € avec une IA, 46 € avec une autre.</span></div><div><b>506</b><span>IA comparées chaque nuit, sur leur prix et leurs capacités.</span></div><div><b>34 s</b><span>suffisent à nos outils pour revenir seuls à la version d'avant, si une mise à jour échoue.</span></div></div><section class=\"pc-bloc pc-apparait\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">04</p><p class=\"pc-mono\">Le bon modèle</p><h2>À chaque tâche, <em>son modèle.</em></h2><p>Quatre tâches, quatre modèles. rAIme teste chaque modèle sur ses tâches avant de l'adopter, et en change dès qu'un autre fait mieux pour moins cher. Chez vous, même méthode : la bonne IA à chaque poste, au juste prix.</p></div><div class=\"pc-visuel\"><div class=\"pc-routes\"><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><path d=\"M9 5h13l5 5v21H9z\"/><path d=\"M22 5v5h5\"/><path d=\"M13 16h10M13 20h10M13 24h6\"/></svg><b>Extraire</b><span>Un modèle léger : 0,09 $ le million de jetons lus</span></div><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"10\" r=\"3\"/><circle cx=\"27\" cy=\"10\" r=\"3\"/><circle cx=\"18\" cy=\"27\" r=\"3\"/><path d=\"M11.5 11.8l4.6 12.6M24.5 11.8l-4.6 12.6M12 10h12\"/></svg><b>Raisonner</b><span>Un modèle puissant, pour les décisions importantes</span></div><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><path d=\"M8 28l3-9L24 6l6 6-13 13z\"/><path d=\"M21 9l6 6\"/><path d=\"M8 31h20\"/></svg><b>Rédiger</b><span>Rapide et économique : 0,03 $ le million de jetons lus</span></div><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><path d=\"M6 8h24l-9 11v9l-6-3v-6z\"/></svg><b>Trier</b><span>Le plus petit : 5 fois moins cher, presque aussi juste</span></div></div></div></section><section class=\"pc-bloc pc-apparait pc-bloc--inverse\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">05</p><p class=\"pc-mono\">Vos données</p><h2>Vos documents deviennent <em>un assistant.</em></h2><p>L'assistant cherche dans vos documents et répond en citant ses sources. Tout reste sur un serveur que vous contrôlez ; l'IA se remplace à tout moment, sans rien reconstruire.</p></div><div class=\"pc-visuel\"><svg class=\"pc-schema\" viewBox=\"0 0 480 210\" role=\"img\" aria-label=\"Vos documents, une recherche sur votre serveur, un assistant qui répond en citant ses sources\"><rect class=\"pc-cadre\" x=\"2\" y=\"30\" width=\"476\" height=\"150\" rx=\"10\"/><text class=\"pc-petit\" x=\"16\" y=\"22\">VOTRE SERVEUR</text><rect x=\"18\" y=\"74\" width=\"122\" height=\"52\" rx=\"6\"/><text x=\"79\" y=\"104\" text-anchor=\"middle\">DOCUMENTS</text><rect x=\"179\" y=\"74\" width=\"122\" height=\"52\" rx=\"6\"/><text x=\"240\" y=\"104\" text-anchor=\"middle\">RECHERCHE</text><rect x=\"340\" y=\"74\" width=\"122\" height=\"52\" rx=\"6\"/><text x=\"401\" y=\"104\" text-anchor=\"middle\">ASSISTANT</text><path class=\"pc-flux\" d=\"M140 100H179\"/><path class=\"pc-flux\" d=\"M301 100H340\"/><path class=\"pc-flux\" d=\"M401 126v36H79v-36\"/><text class=\"pc-petit\" x=\"79\" y=\"148\" text-anchor=\"middle\">contrats, notes</text><text class=\"pc-petit\" x=\"240\" y=\"148\" text-anchor=\"middle\">dans vos textes</text><text class=\"pc-petit\" x=\"401\" y=\"148\" text-anchor=\"middle\">répond, cite</text></svg></div></section><section class=\"pc-bloc pc-apparait pc-bloc--large\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">06</p><p class=\"pc-mono\">La preuve</p><h2>Une entreprise qui fonctionne <em>à l'IA.</em></h2><p>rAIme applique d'abord à elle-même ce qu'elle conseille : des agents qui cherchent, mesurent, écrivent et se corrigent, jour et nuit.</p><button class=\"pc-preuve\" data-vers=\"projets/raime\">Voir les agents →</button></div><div class=\"pc-visuel pc-visuel--onto\"><svg class=\"pc-onto\" viewBox=\"0 0 660 390\" role=\"img\" aria-label=\"Le cerveau de rAIme : veille, savoir, agent IA, recherche, tests, accord, mise en ligne\"><defs><pattern id=\"po-hachures\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"2.2\" height=\"5\" fill=\"#fff\"/></pattern></defs><rect class=\"po-bouton-plein\" x=\"14\" y=\"18\" width=\"114\" height=\"30\" rx=\"2\"/><text class=\"po-bouton-texte\" x=\"71\" y=\"37\" text-anchor=\"middle\">AGENT IA</text><rect class=\"po-bouton\" x=\"14\" y=\"56\" width=\"114\" height=\"30\" rx=\"2\"/><text class=\"po-bouton-texte po-clair\" x=\"71\" y=\"75\" text-anchor=\"middle\">CHAT</text><text class=\"po-sous\" x=\"14\" y=\"118\">MODÈLES</text><rect class=\"po-case\" x=\"14\" y=\"128\" width=\"34\" height=\"34\" rx=\"3\"/><svg x=\"23\" y=\"137\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\"><use href=\"#o-deepseek\"/></svg><rect class=\"po-cas ion><div class=\"pc-bloc-logos pc-apparait\"><p class=\"pc-num\" aria-hidden=\"true\">07</p><p class=\"pc-mono\">Les outils</p><h2>Les outils que nous <em>maîtrisons.</em></h2><div class=\"pc-logos\"><div><svg style=\"--i:0\" aria-hidden=\"true\"><use href=\"#o-claude\"/></svg>Claude</div><div><svg style=\"--i:1\" aria-hidden=\"true\"><use href=\"#o-openai\"/></svg>ChatGPT</div><div><svg style=\"--i:2\" aria-hidden=\"true\"><use href=\"#o-googlegemini\"/></svg>Gemini</div><div><i class=\"pc-point\" style=\"--i:3\"></i>Copilot</div><div><i class=\"pc-point\" style=\"--i:4\"></i>Firefly</div><div><svg style=\"--i:5\" aria-hidden=\"true\"><use href=\"#o-deepseek\"/></svg>DeepSeek</div><div><svg style=\"--i:6\" aria-hidden=\"true\"><use href=\"#o-qwen\"/></svg>Qwen</div><div><svg style=\"--i:7\" aria-hidden=\"true\"><use href=\"#o-ollama\"/></svg>Ollama</div><div><svg style=\"--i:8\" aria-hidden=\"true\"><use href=\"#o-groq\"/></svg>Groq</div><div><svg style=\"--i:9\" aria-hidden=\"true\"><use href=\"#o-openrouter\"/></svg>OpenRouter</div><div><svg style=\"--i:10\" aria-hidden=\"true\"><use href=\"#o-huggingface\"/></svg>Hugging Face</div><div><svg style=\"--i:11\" aria-hidden=\"true\"><use href=\"#o-langchain\"/></svg>LangChain</div><div><i class=\"pc-point\" style=\"--i:12\"></i>ChromaDB</div><div><svg style=\"--i:13\" aria-hidden=\"true\"><use href=\"#o-n8n\"/></svg>n8n</div><div><svg style=\"--i:14\" aria-hidden=\"true\"><use href=\"#o-python\"/></svg>Python</div><div><svg style=\"--i:15\" aria-hidden=\"true\"><use href=\"#o-fastapi\"/></svg>FastAPI</div><div><svg style=\"--i:16\" aria-hidden=\"true\"><use href=\"#o-nodedotjs\"/></svg>Node.js</div><div><svg style=\"--i:17\" aria-hidden=\"true\"><use href=\"#o-javascript\"/></svg>JavaScript</div><div><svg style=\"--i:18\" aria-hidden=\"true\"><use href=\"#o-react\"/></svg>React</div><div><svg style=\"--i:19\" aria-hidden=\"true\"><use href=\"#o-astro\"/></svg>Astro</div><div><svg style=\"--i:20\" aria-hidden=\"true\"><use href=\"#o-postgresql\"/></svg>PostgreSQL</div><div><svg style=\"--i:21\" aria-hidden=\"true\"><use href=\"#o-docker\"/></svg>Docker</div><div><svg style=\"--i:22\" aria-hidden=\"true\"><use href=\"#o-hetzner\"/></svg>Hetzner</div><div><svg style=\"--i:23\" aria-hidden=\"true\"><use href=\"#o-cloudflare\"/></svg>Cloudflare</div><div><svg style=\"--i:24\" aria-hidden=\"true\"><use href=\"#o-caddy\"/></svg>Caddy</div><div><svg style=\"--i:25\" aria-hidden=\"true\"><use href=\"#o-github\"/></svg>GitHub</div><div><svg style=\"--i:26\" aria-hidden=\"true\"><use href=\"#o-tailscale\"/></svg>Tailscale</div><div><svg style=\"--i:27\" aria-hidden=\"true\"><use href=\"#o-searxng\"/></svg>SearXNG</div><div><svg style=\"--i:28\" aria-hidden=\"true\"><use href=\"#o-stripe\"/></svg>Stripe</div><div><svg style=\"--i:29\" aria-hidden=\"true\"><use href=\"#o-resend\"/></svg>Resend</div><div><svg style=\"--i:30\" aria-hidden=\"true\"><use href=\"#o-metabase\"/></svg>Metabase</div><div><i class=\"pc-point\" style=\"--i:31\"></i>DocuSeal</div><div><svg style=\"--i:32\" aria-hidden=\"true\"><use href=\"#o-obsidian\"/></svg>Obsidian</div><div><svg style=\"--i:33\" aria-hidden=\"true\"><use href=\"#o-figma\"/></svg>Figma</div></div></div></div>", "U": {"accueil": "Accueil", "titre": "rAIme — conseil en intelligence artificielle", "reserver": "Réserver un appel d'une heure", "decouvrir": "Découvrir", "legal": ["Mentions légales", "CGV", "Confidentialité"], "autre": "Read in English", "jour": "Passer en version jour", "nuit": "Passer en version nuit", "cta": "Réserver un appel", "avis": "avis Google", "avis_bientot": "Vos avis Google s'afficheront ici", "cle": ["Améliorer votre quotidien", "avec l'IA."], "comment": "Comment ça marche", "rdv_mono": "Un appel d'une heure", "rdv_titre": "Choisissez votre créneau. La confirmation arrive par e-mail.", "menu": "Menu", "fermer": "Fermer", "liens_rapides": "Liens rapides", "autres_liens": "Autres liens", "contact": "Nous écrire", "menu_phrase": "Choisir la bonne IA, et le prouver.", "menu_lieu": "Haute-Savoie · Genève · à distance", "noms": {"accueil": "Accueil", "particulier": "Particulier", "pro": "Professionnel", "projets": "Projets", "pro/formation": "Formation", "pro/audit": "Audit", "pro/arbitrage": "Arbitrage", "pro/automatisation": "Automatisation", "tarifs": "Offres et tarifs", "tarifs/particulier": "Particulier"}, "onglet_pro": "Professionnel", "onglet_part": "Particulier"}, "S": {"arbitrage": "<p class=\"pc-mono\">Comment ça marche</p><h2 id=\"pc-score-titre\">Le Score rAIme, <em>sur 1000.</em></h2><p class=\"pc-score-intro\">Une question, une note : une proposition d'IA est-elle prête à être signée ? La méthode est publique : chacun peut refaire le calcul à la main, y compris le prestataire noté.</p><div class=\"pc-score-axes\"><div><b>A</b><h3>Sincérité</h3><p>Ce que la proposition écrit, et ce qu'elle tait : 22 points de contrôle sur le besoin, les coûts, le contrat, la propriété des données et les conditions de sortie.</p></div><div><b>B</b><h3>Rentabilité</h3><p>Ce que les chiffres donnent : le temps gagné, le coût complet, et le nombre de mois pour rembourser l'investissement.</p></div><div><b>C</b><h3>Réalisme</h3><p>La démarche proposée (pilote, étapes, arrêt possible à coût connu) et la maturité de votre entreprise : données accessibles, tâches décrites, un porteur du projet, du temps pour l'adoption.</p></div></div><div class=\"pc-score-regle\"><p class=\"pc-mono\">La règle</p><p class=\"pc-score-formule\">Score = min(A, B, C) × 10</p><p>La note finale est celle de l'axe le plus faible, jamais la moyenne. Un contrat parfait ne rattrape pas un investissement qui ne rapporte pas.</p></div><div class=\"pc-score-deux\"><div><p class=\"pc-mono\">Lire la note</p><dl class=\"pc-score-echelle\"><div><dt>800 – 1000</dt><dd>Signable</dd></div><div><dt>600 – 790</dt><dd>Signable sous conditions</dd></div><div><dt>400 – 590</dt><dd>À renégocier</dd></div><div><dt>200 – 390</dt><dd>À refaire</dd></div><div><dt>0 – 190</dt><dd>À refuser</dd></div></dl></div><div><p class=\"pc-mono\">Trois garanties</p><ul class=\"pc-score-garanties\"><li>Une clause essentielle absente (propriété des données, propriété de ce qui est construit, conditions de sortie) plafonne la Sincérité à 40 sur 100.</li><li>Un chiffre manque ? La note n'est pas rendue : nous indiquons quelles données obtenir.</li><li>Chaque note est rendue avec le détail des points perdus et la version de la méthode (v2.0).</li></ul></div></div><div class=\"pc-score-usages\"><p><b>Dans l'arbitrage</b>Chaque offre reçue est notée sur 1000, avec ce qu'il faut obtenir avant de signer.</p></div>", "audit": "<p class=\"pc-mono\">Comment ça marche</p><h2 id=\"pc-score-titre\">L'audit de vos postes, en <em>quatre temps.</em></h2><p class=\"pc-score-intro\">Une question : où l'IA vous fait-elle gagner du temps, et combien ? Chaque gain est chiffré, et chaque chiffre dit d'où il vient.</p><div class=\"pc-score-axes pc-score-axes--4\"><div><b>1</b><h3>Cartographier</h3><p>Pour chaque tâche répétitive : sa fréquence, son temps, qui la fait, avec quels outils, et à quel point elle pèse sur l'équipe, de 1 à 5.</p></div><div><b>2</b><h3>Mesurer l'impact</h3><p>Le temps passé, multiplié par la fréquence et par la pénibilité.</p></div><div><b>3</b><h3>Juger la faisabilité</h3><p>Des données propres et accessibles, des outils qui se connectent, un risque maîtrisé.</p></div><div><b>4</b><h3>Classer et chiffrer</h3><p>Les gains en heures et en euros par an, et le nombre de mois pour rembourser l'investissement.</p></div></div><div class=\"pc-score-regle\"><p class=\"pc-mono\">La règle</p><p class=\"pc-score-formule\">Priorité = impact ÷ effort</p><p>Les tâches sont classées de la plus rentable à la moins rentable. Les trois premières forment votre plan d'action.</p></div><div class=\"pc-score-deux\"><div><p class=\"pc-mono\">Ce que vous recevez</p><ul class=\"pc-score-garanties\"><li>Les gains classés, tâche par tâche.</li><li>Un plan d'action sur 90 jours, en trois temps : les gains rapides, les chantiers de fond, puis l'optimisation.</li></ul></div><div><p class=\"pc-mono\">Trois garanties</p><ul class=\"pc-score-garanties\"><li>Chaque chiffre porte son origine : mesuré chez vous, déclaré par vous, ou estimé. Une estimation est toujours signalée.</li><li>Chaque gain a un indice de confiance, haut, moyen ou faible, selon la qualité des données.</li><li>L'audit sait dire non : une tâche qui ne se rembourse pas est déconseillée.</li></ul></div></div>"}}, "en": {"N": {"accueil": {"type": "chemins", "etiquette": "rAIme", "titre": ["rAIme,", "artificial intelligence consulting."], "phrase": "Training, automation, workplace audits, independent review of the offers you receive.", "enfants": ["particulier", "pro", "projets"]}, "projets": {"type": "chemins", "etiquette": "Projects", "court": "Tools that run every day", "titre": ["Our projects,", "in production."], "phrase": "Tools built for real, running every day.", "enfants": ["projets/raime", "projets/cockpit", "projets/qg", "projets/clio", "projets/voyage", "projets/gotham"]}, "projets/raime": {"type": "projet", "titre": "The rAIme agents", "etiquette": "Projects", "court": "A team of agents running the company", "phrase": "Twenty-eight agents and automations run the company, day and night: they search, write, monitor and alert.", "faits": [["What they do", "They find companies, locate contacts, write, and follow AI news"], ["Every morning", "A full report, sent automatically"], ["Their strength", "A sales proposal analysed in 144 seconds"]], "image": ["/projets/raime-cockpit.webp", "The rAIme agents dashboard", 1280, 600], "chiffres": [["28", "agents and automations in service"], ["2,887", "companies identified"], ["200+", "articles read every day"]]}, "projets/cockpit": {"type": "projet", "titre": "Cockpit", "etiquette": "Projects", "court": "An executive assistant's control panel", "phrase": "An executive assistant's control panel: the da 2\" text-anchor=\"end\">73 %</text><rect class=\"pm-fond\" x=\"482\" y=\"340\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"340\" width=\"114\" height=\"3\" style=\"transition-delay:560ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"366\">Quality, reliability</text><text class=\"pm-ligne\" x=\"638\" y=\"366\" text-anchor=\"end\">64 %</text><rect class=\"pm-fond\" x=\"482\" y=\"374\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"374\" width=\"100\" height=\"3\" style=\"transition-delay:700ms\"/><text class=\"pm-ligne\" x=\"482\" y=\"400\">Complex work</text><text class=\"pm-ligne\" x=\"638\" y=\"400\" text-anchor=\"end\">56 %</text><rect class=\"pm-fond\" x=\"482\" y=\"408\" width=\"156\" height=\"3\"/><rect class=\"pm-barre\" x=\"482\" y=\"408\" width=\"87\" height=\"3\" style=\"transition-delay:840ms\"/><text class=\"pm-rel\" x=\"108\" y=\"105\" text-anchor=\"start\">build</text><text class=\"pm-rel\" x=\"108\" y=\"215\" text-anchor=\"start\">power</text><text class=\"pm-rel\" x=\"214\" y=\"259\" text-anchor=\"middle\">equip</text><text class=\"pm-rel\" x=\"222\" y=\"118\" text-anchor=\"middle\">compares</text><text class=\"pm-rel\" x=\"332\" y=\"196\" text-anchor=\"end\">supports</text><text class=\"pm-rel\" x=\"446\" y=\"212\" text-anchor=\"end\">use it to</text><text class=\"pm-rel\" x=\"452\" y=\"330\" text-anchor=\"middle\">aim to</text><text class=\"pm-rel\" x=\"348\" y=\"340\" text-anchor=\"start\">run into</text></svg><div class=\"pm-m\" aria-hidden=\"true\"><div class=\"pm-m-noeud\"><b>LABS</b><span>OpenAI, Google, Mistral…</span></div><p class=\"pm-m-rel\">↓ build</p><div class=\"pm-m-noeud\"><b>MODELS</b><span>506 tracked every night</span></div><p class=\"pm-m-rel\">↓ power</p><div class=\"pm-m-noeud\"><b>AI TOOLS</b><span>assistants, agents</span></div><p class=\"pm-m-rel\">↓ equip</p><div class=\"pm-m-noeud pm-m-centre\"><b>COMPANIES</b><span>18% in France · 58% of firms with 250+ staff</span></div><p class=\"pm-m-rel\">use it to ↓</p><div class=\"pm-m-panneau\"><b>USES</b><p><span>Analyse text</span><i>56 %</i><s><u style=\"width:56%\"></u></s></p><p><span>Generate text, voice</span><i>43 %</i><s><u style=\"width:43%\"></u></s></p><p><span>Images, video, sound</span><i>41 %</i><s><u style=\"width:41%\"></u></s></p><p><span>Transcribe speech</span><i>34 %</i><s><u style=\"width:34%\"></u></s></p></div><p class=\"pm-m-rel\">aim to ↓</p><div class=\"pm-m-panneau\"><b>GOALS</b><p><span>Optimise costs</span><i>73 %</i><s><u style=\"width:73%\"></u></s></p><p><span>Quality, reliability</span><i>64 %</i><s><u style=\"width:64%\"></u></s></p><p><span>Complex work</span><i>56 %</i><s><u style=\"width:56%\"></u></s></p></div><p class=\"pm-m-rel\">run into ↓</p><div class=\"pm-m-noeud\"><b>BARRIERS</b><span>skills, data, costs</span></div><p class=\"pm-m-rel\">+</p><div class=\"pm-m-noeud pm-m-raime\"><b>rAIme</b><span>chooses · trains · measures</span></div></div><figcaption>Percentages: share of companies that use AI (Insee, 2025)</figcaption></figure></div></section><section class=\"pc-bloc-freins pc-apparait\"><p class=\"pc-num\" aria-hidden=\"true\">01</p><p class=\"pc-mono\">Obstacles</p><h2>What holds <em>them back.</em></h2><p class=\"pc-freins-intro\">Many try AI, few get a real gain. Each obstacle has an answer.</p><div class=\"pc-freins\"><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Usefulness</span><b>71%</b><h3>of companies without AI do not see what it would do for them.</h3><p class=\"pc-frein-rep\">→ The job audit shows where AI saves you hours.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Skills</span><b>54%</b><h3>of companies without AI say they lack the expertise.</h3><p>And 53% of those using it are held back by it.</p><p class=\"pc-frein-rep\">→ Training, built on your own cases.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Data</span><b>43%</b><h3>of companies using AI worry about protecting their data.</h3><p class=\"pc-frein-rep\">→ Your tools on a server you control.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Costs</span><b>33%</b><h3>of companies using AI find the costs too high.</h3><p class=\"pc-frein-rep\">→ The right model for each task, at the right price.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Results</span><b>60%</b><h3>of companies worldwide get almost no value from their AI investments.</h3><p class=\"pc-frein-rep\">→ Every proposal read and scored before you sign.</p></div><div class=\"pc-frein\"><span class=\"pc-frein-etiq\">Scaling up</span><b>Nearly 2/3</b><h3>of organisations have not yet rolled AI out across the whole company.</h3><p class=\"pc-frein-rep\">→ A monthly follow-up, from trial to everyday use.</p></div></div><p class=\"pc-sources\">Sources: Insee, ICT survey 2025, companies with 10+ employees (71, 54, 43, 33%) · BCG, The Widening AI Value Gap, September 2025 (60%) · McKinsey, The State of AI, 2025 (2/3)</p></section><div class=\"pc-intro pc-apparait\"><p class=\"pc-mono\">AI, up close</p><h2>What happens behind <em>an answer.</em></h2><p>Choose AI, pay the right price, use it well. Every figure comes from rAIme's own measurements.</p></div><section class=\"pc-bloc pc-apparait\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">02</p><p class=\"pc-mono\">Tokens</p><h2>Everything is counted <em>in tokens.</em></h2><p>AI reads and writes in pieces of words: tokens. Each one is billed. Reading one million tokens costs $0.017 to $0.78 depending on the model: up to 46 times more, for the same job.</p></div><div class=\"pc-visuel\"><div class=\"pc-jetons\"><span style=\"--i:0\">Summ</span><span style=\"--i:1\">arize</span><span style=\"--i:2\">this</span><span style=\"--i:3\">contract</span><span style=\"--i:4\">in</span><span style=\"--i:5\">three</span><span style=\"--i:6\">points</span><span style=\"--i:7\">.</span></div><p class=\"pc-legende\">Example: 6 words, 8 tokens.</p></div></section><section class=\"pc-bloc pc-apparait pc-bloc--inverse\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">03</p><p class=\"pc-mono\">The request</p><h2>A clear request costs <em>less.</em></h2><p>A vague request makes AI fumble: more attempts, more tokens, an average result. At rAIme, a rewritten request and a corrected setting: from 0 to 3 successful messages out of 3, at one fifth of the cost.</p></div><div class=\"pc-visuel\"><div class=\"pc-prompts\"><div class=\"pc-prompt\"><b>Before <i>0 out of 3</i></b><p>“Ask no questions.” … then, further down: “End with a question.”</p></div><div class=\"pc-prompt pc-prompt--apres\"><b>After <i>3 out of 3 · cost ÷ 5</i></b><p>“One clear request. Six to ten lines. No prices.”</p></div></div></div></section><div class=\"pc-grands pc-apparait\"><div><b>46 times</b><span>more expensive, for the same job: €1 with one AI, €46 with another.</span></div><div><b>506</b><span>AI models compared every night, on price and capability.</span></div><div><b>34 s</b><span>is all our tools need to roll back on their own if an update fails.</span></div></div><section class=\"pc-bloc pc-apparait\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">04</p><p class=\"pc-mono\">The right model</p><h2>Every task <em>has its model.</em></h2><p>Four tasks, four models. rAIme tests each model on its tasks before adopting it, and switches as soon as another does better for less. For you, the same method: the right AI for every role, at the right price.</p></div><div class=\"pc-visuel\"><div class=\"pc-routes\"><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><path d=\"M9 5h13l5 5v21H9z\"/><path d=\"M22 5v5h5\"/><path d=\"M13 16h10M13 20h10M13 24h6\"/></svg><b>Extract</b><span>A light model: $0.09 per million tokens read</span></div><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"10\" r=\"3\"/><circle cx=\"27\" cy=\"10\" r=\"3\"/><circle cx=\"18\" cy=\"27\" r=\"3\"/><path d=\"M11.5 11.8l4.6 12.6M24.5 11.8l-4.6 12.6M12 10h12\"/></svg><b>Reason</b><span>A powerful model, for important decisions</span></div><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><path d=\"M8 28l3-9L24 6l6 6-13 13z\"/><path d=\"M21 9l6 6\"/><path d=\"M8 31h20\"/></svg><b>Write</b><span>Fast and cheap: $0.03 per million tokens read</span></div><div class=\"pc-route\"><svg viewBox=\"0 0 36 36\" aria-hidden=\"true\"><path d=\"M6 8h24l-9 11v9l-6-3v-6z\"/></svg><b>Sort</b><span>The smallest: 5 times cheaper, almost as accurate</span></div></div></div></section><section class=\"pc-bloc pc-apparait pc-bloc--inverse\"><div class=\"pc-texte\"><p class=\"pc-num\" aria-hidden=\"true\">05</p><p class=\"pc-mono\">Your data</p><h2>Your documents become <em>an assistant.</em></h2><p>The assistant searches your documents and answers with its sources. Everything stays on a server you control; the AI can be replaced at any time, without rebuilding anything.</p></div><div class=\"pc-visuel\"><svg class=\"pc-schema\" viewBox=\"0 0 480 210\" role=\"img\" aria-label=\"Your documents, a search on your server, an assistant that answers and cites its sources\"><rect class=\"pc-cadre\" x=\"2\" y=\"30\" width=\"476\" height=\"150\" rx=\"10\"/><text class=\"pc-petit\" x=\"16\" y=\"22\">YOUR SERVER</text><rect x=\"18\" y=\"74\" width=\"122\" height=\"52\" rx=\"6\"/><text x=\"79\" y=\"104\" text-anchor=\"middle\">DOCUMENTS</text><rect x=\"179\" y=\"74\" width=\"122\" height=\"52\" rx=\"6\"/><text x=\"240\" y=\"104\" text-anchor=\"middle\">SEARCH</text><rect x=\"340\" y=\"74\" width=\"122\" height=\"52\" rx=\"6\"/><text x=\"401\" y=\"104\" text-anchor=\"middle\">ASSISTANT</text><path class=\"pc-flux\" d=\"M140 100H179\"/><path class=\"pc-flux\" d=\"M301 100H340\"/><path class=\"pc-flux\" d=\"M401 126v36H79v-36\"/><text class=\"pc-petit\" x=\"79\" y=\"148\" text-anchor=\"middle\">contracts, notes</text><text class=\"pc-petit\" x=\"240\" y=\"148\" text-a me Score, <em>out of 1000.</em></h2><p class=\"pc-score-intro\">One question, one score: is an AI proposal ready to be signed? The method is public: anyone can redo the calculation by hand, including the provider being scored.</p><div class=\"pc-score-axes\"><div><b>A</b><h3>Transparency</h3><p>What the proposal states, and what it leaves out: 22 checkpoints on the need, costs, contract, data ownership and exit terms.</p></div><div><b>B</b><h3>Return</h3><p>What the figures say: time saved, full cost, and how many months it takes to pay back the investment.</p></div><div><b>C</b><h3>Realism</h3><p>The proposed approach (pilot, stages, the option to stop at a known cost) and your company's readiness: accessible data, documented tasks, a project owner, time for adoption.</p></div></div><div class=\"pc-score-regle\"><p class=\"pc-mono\">The rule</p><p class=\"pc-score-formule\">Score = min(A, B, C) × 10</p><p>The final score is the weakest axis, never the average. A perfect contract does not make up for an investment that does not pay off.</p></div><div class=\"pc-score-deux\"><div><p class=\"pc-mono\">Reading the score</p><dl class=\"pc-score-echelle\"><div><dt>800 – 1000</dt><dd>Ready to sign</dd></div><div><dt>600 – 790</dt><dd>Sign with conditions</dd></div><div><dt>400 – 590</dt><dd>Renegotiate</dd></div><div><dt>200 – 390</dt><dd>Ask for a new proposal</dd></div><div><dt>0 – 190</dt><dd>Decline</dd></div></dl></div><div><p class=\"pc-mono\">Three guarantees</p><ul class=\"pc-score-garanties\"><li>A missing key clause (data ownership, ownership of what is built, exit terms) caps Transparency at 40 out of 100.</li><li>A figure is missing? No score is given: we tell you which data to obtain.</li><li>Every score comes with the detail of lost points and the method version (v2.0).</li></ul></div></div><div class=\"pc-score-usages\"><p><b>In the review</b>Every offer you receive is scored out of 1000, with what to obtain before signing.</p></div>", "audit": "<p class=\"     var vue = long ? heros(id,n) : onglet ? tarifs(id,n,onglet) : n.type === "chemins" ? chemins(id,n)
      : n.type === "projet" ? projet(id,n) : fiche(id,n);
    scene.classList.toggle("pc-scene--long", long);
    scene.innerHTML = long ? vue + DESSOUS : vue;
    if(long) animerChamp();
    ouvrir(false);
    if(long) apparaitre();
    fil.innerHTML = id === "accueil" ? "" : chemin(id).map(function(x,i){
      return (i ? '<span>›</span>' : "") + '<button data-vers="' + x + '">' + esc(x === "accueil" ? U.accueil : nom(x)) + '</button>';
    }).join("");
    retour.classList.toggle("pc-la", id !== "accueil");
    retour.setAttribute("data-vers", parent(id));
    document.title = (id === "accueil" ? U.titre : nom(onglet ? "tarifs" : id) + " — rAIme");
    window.scrollTo(0, 0);
  }
  function aller(id){
    var cible = id === "accueil" ? "" : "#/" + id, ici = location.hash === "#" ? "" : location.hash;
    if(ici === cible){ rendre(id); return; }   // meme adresse : on reaffiche et on remonte en haut
    location.hash = id === "accueil" ? "#" : "#/" + id;
  }
  var ANCIENNES = {"offres":"pro","formation":"pro/formation","audit":"pro/audit","diagnostic":"pro/audit",
    "arbitrage":"pro/arbitrage","verifications":"pro/arbitrage","suivi":"pro","pilotage":"pro","accompagnement":"pro",
    "projets":"projets","automatisation":"pro/automatisation","automatiser":"pro/automatisation","approche":"accueil","methode":"accueil","secteurs":"pro","contact":"accueil","formulaire":"accueil"};
  function lire(){
    var h = location.hash.replace(/^#\/?/, "");
    if(h && !N[h] && h !== "tarifs/particulier" && ANCIENNES[h.replace(/^\//, "")]){ h = ANCIENNES[h.replace(/^\//, "")]; history.replaceState(null, "", h === "accueil" ? "#" : "#/" + h); }
    return h || "accueil";
  }

  // Jour ou nuit : la nuit est le site d'origine ; le jour inverse le blanc et le noir (voir jour.py).
  function etiquetteJour(){
    var j = document.getElementById("pc-jour"); if(!j || !U.jour) return;
    var jour = document.documentElement.hasAttribute("data-jour");
    j.setAttribute("aria-label", jour ? U.nuit : U.jour); j.setAttribute("aria-pressed", jour ? "true" : "false");
  }
  document.addEventListener("click", function(e){
    var jb = e.target.closest("[data-jour-bascule]");
    if(jb){ e.preventDefault(); var r = document.documentElement, jour = !r.hasAttribute("data-jour");
      if(jour) r.setAttribute("data-jour", ""); else r.removeAttribute("data-jour");
      try{ localStorage.setItem("pc-jour", jour ? "1" : "0"); }catch(err){}
      etiquetteJour(); return; }
    var lg = e.target.closest("[data-langue]");
    if(lg){ e.preventDefault(); var l = LANGUE === "fr" ? "en" : "fr"; try{ localStorage.setItem("pc-langue", l); }catch(err){}
      langue(l); rendre(lire()); return; }
    var sc = e.target.closest("[data-score]");
    if(sc){ e.preventDefault(); score(true, sc.getAttribute("data-score")); return; }
    if(e.target.closest("[data-score-fermer]") || e.target.id === "pc-score"){ e.preventDefault(); score(false); return; }
    var lien = e.target.closest("a");
    if(lien && PIED && lien.getAttribute("href") === RES && reserver(true)){ e.preventDefault(); ouvrir(false); return; }
    if(e.target.closest("[data-rdv-fermer]") || e.target.id === "pc-rdv"){ e.preventDefault(); reserver(false); return; }
    if(e.target.closest("[data-menu]")){ e.preventDefault(); ouvrir(true); return; }
    if(e.target.closest("[data-fermer]")){ e.preventDefault(); ouvrir(false); return; }
    var d = e.target.closest("[data-descendre]");
    if(d){ e.preventDefault(); var s = document.getElementById("pc-dessous"); if(s) s.scrollIntoView({behavior:"smooth", block:"start"}); return; }
    var b = e.target.closest("[data-vers]");
    if(b){ e.preventDefault(); aller(b.getAttribute("data-vers")); }
  });
  window.addEventListener("hashchange", function(){ rendre(lire()); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ ouvrir(false); reserver(false); score(false); } });
  langue(choisir());
  rendre(lire());

  var voile = document.getElementById("pc-charge"), barre = voile && voile.querySelector("i");
  if(voile){
    var deja = false; try{ deja = sessionStorage.getItem("pc-vu") === "1"; }catch(err){}
    if(deja || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)){ voile.classList.add("pc-partie"); }
    else {
      requestAnimationFrame(function(){ barre.style.width = "100%"; });
      setTimeout(function(){ voile.classList.add("pc-partie"); try{ sessionStorage.setItem("pc-vu","1"); }catch(err){} }, 1200);
    }
  }
})();
</script>
</body></html>
